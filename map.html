<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0f14"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <!-- OPEN GRAPH -->

  <meta
    property="og:title"
    content="SportRoom — Спортивная карта"
  >

  <meta
    property="og:description"
    content="Спортивные комплексы, площадки, бассейны, залы и другие места рядом с вами."
  >

  <meta
    property="og:type"
    content="website"
  >

  <title>Карта — SportRoom</title>


  <!-- LEAFLET -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >


  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #0b0f14;
    }


    body {
      width: 100%;
      min-height: 100vh;

      min-height: 100dvh;

      overflow-x: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f4f6f8;

      color: #111827;

      -webkit-font-smoothing: antialiased;

      padding-bottom:
        env(safe-area-inset-bottom);
    }


    button,
    input {
      font-family: inherit;
    }


    button {
      -webkit-tap-highlight-color: transparent;
    }


    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 2000;

      height:
        calc(
          70px +
          env(safe-area-inset-top)
        );

      padding-top:
        env(safe-area-inset-top);

      background:
        rgba(11,15,20,.96);

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    .header-inner {

      width:
        min(
          1180px,
          calc(100% - 30px)
        );

      height: 70px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .logo {

      flex-shrink: 0;

      text-decoration: none;

      color: #ffffff;

      font-size: 25px;

      font-weight: 950;

      letter-spacing: -1.2px;
    }


    .logo span {
      color: #ef4444;
    }


    .desktop-nav {

      display: flex;

      align-items: center;

      gap: 5px;
    }


    .desktop-nav a {

      text-decoration: none;

      color: #9ca3af;

      font-size: 13px;

      font-weight: 800;

      padding: 10px 13px;

      border-radius: 10px;

      transition: .2s ease;
    }


    .desktop-nav a:hover,
    .desktop-nav a.active {

      color: #ffffff;

      background:
        rgba(255,255,255,.07);
    }


    .header-actions {

      display: flex;

      align-items: center;

      gap: 8px;
    }


    .header-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 40px;

      padding: 0 14px;

      border-radius: 10px;

      text-decoration: none;

      font-size: 12px;

      font-weight: 850;

      transition: .2s ease;
    }


    .header-login {

      color: #ffffff;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.08);
    }


    .header-register {

      color: #ffffff;

      background: #ef4444;
    }


    .header-login:hover {
      background: rgba(255,255,255,.13);
    }


    .header-register:hover {
      background: #dc2626;
    }


    /* =====================================================
       MAP APP
       ===================================================== */

    .map-app {

      position: fixed;

      top:
        calc(
          70px +
          env(safe-area-inset-top)
        );

      left: 0;
      right: 0;
      bottom: 0;

      overflow: hidden;
    }


    #map {

      position: absolute;

      inset: 0;

      z-index: 1;

      background: #dfe6eb;
    }


    /* =====================================================
       SEARCH PANEL
       ===================================================== */

    .map-panel {

      position: absolute;

      z-index: 1000;

      top: 20px;

      left: 20px;

      width:
        min(
          390px,
          calc(100% - 40px)
        );

      display: flex;

      flex-direction: column;

      gap: 10px;

      pointer-events: none;
    }


    .map-panel > * {
      pointer-events: auto;
    }


    .search-box {

      display: flex;

      align-items: center;

      gap: 9px;

      min-height: 54px;

      padding: 0 13px;

      background:
        rgba(255,255,255,.97);

      border:
        1px solid
        rgba(0,0,0,.08);

      border-radius: 16px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.14);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);
    }


    .search-icon {

      flex-shrink: 0;

      font-size: 20px;
    }


    #searchInput {

      width: 100%;

      min-width: 0;

      height: 52px;

      border: 0;

      outline: 0;

      background: transparent;

      color: #111827;

      font-size: 14px;

      font-weight: 650;
    }


    #searchInput::placeholder {
      color: #9ca3af;
    }


    .clear-search {

      width: 32px;

      height: 32px;

      flex-shrink: 0;

      border: 0;

      border-radius: 9px;

      background: #f1f3f5;

      color: #6b7280;

      cursor: pointer;

      display: none;

      align-items: center;

      justify-content: center;

      font-size: 17px;
    }


    /* =====================================================
       FILTERS
       ===================================================== */

    .filters {

      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding: 1px 1px 5px;

      scrollbar-width: none;
    }


    .filters::-webkit-scrollbar {
      display: none;
    }


    .filter {

      flex-shrink: 0;

      min-height: 38px;

      padding: 0 12px;

      border:
        1px solid
        rgba(0,0,0,.07);

      border-radius: 11px;

      background:
        rgba(255,255,255,.96);

      color: #4b5563;

      box-shadow:
        0 7px 20px
        rgba(0,0,0,.09);

      font-size: 11px;

      font-weight: 850;

      cursor: pointer;

      transition: .2s ease;
    }


    .filter.active {

      color: #ffffff;

      background: #ef4444;

      border-color: #ef4444;
    }


    /* =====================================================
       RESULT COUNT
       ===================================================== */

    .result-count {

      align-self: flex-start;

      display: inline-flex;

      align-items: center;

      min-height: 34px;

      padding: 0 12px;

      border-radius: 10px;

      background:
        rgba(11,15,20,.88);

      color: #ffffff;

      font-size: 11px;

      font-weight: 800;

      box-shadow:
        0 8px 20px
        rgba(0,0,0,.16);
    }


    /* =====================================================
       LOCATION BUTTON
       ===================================================== */

    .location-button {

      position: absolute;

      z-index: 1000;

      right: 20px;

      bottom: 90px;

      width: 50px;

      height: 50px;

      border: 0;

      border-radius: 15px;

      background: #ffffff;

      color: #111827;

      box-shadow:
        0 10px 28px
        rgba(0,0,0,.17);

      font-size: 21px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: .2s ease;
    }


    .location-button:hover {

      transform: translateY(-2px);

      box-shadow:
        0 13px 32px
        rgba(0,0,0,.22);
    }


    .location-button.loading {
      animation: pulse 1s infinite;
    }


    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(.91);
      }

      100% {
        transform: scale(1);
      }

    }


    /* =====================================================
       MAP INFO
       ===================================================== */

    .map-info {

      position: absolute;

      z-index: 1000;

      right: 20px;

      bottom: 20px;

      max-width: 280px;

      padding: 10px 13px;

      border-radius: 11px;

      background:
        rgba(11,15,20,.85);

      color: #ffffff;

      font-size: 10px;

      line-height: 1.45;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);
    }


    /* =====================================================
       PLACE CARD
       ===================================================== */

    .place-card {

      position: absolute;

      z-index: 1100;

      left: 20px;

      right: 20px;

      bottom: 20px;

      width:
        min(
          470px,
          calc(100% - 40px)
        );

      display: none;

      background: #ffffff;

      border-radius: 20px;

      padding: 17px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.23);
    }


    .place-card.active {
      display: block;
    }


    .place-card-close {

      position: absolute;

      top: 11px;

      right: 11px;

      width: 32px;

      height: 32px;

      border: 0;

      border-radius: 50%;

      background: #f1f3f5;

      color: #555;

      cursor: pointer;

      font-size: 19px;
    }


    .place-card-top {

      display: flex;

      gap: 13px;

      padding-right: 35px;
    }


    .place-card-icon {

      width: 52px;

      height: 52px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 15px;

      background:
        #fee2e2;

      font-size: 25px;
    }


    .place-card-category {

      color: #ef4444;

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: .7px;

      margin-bottom: 4px;
    }


    .place-card h2 {

      font-size: 17px;

      line-height: 1.15;

      margin-bottom: 4px;

      font-weight: 900;
    }


    .place-card-address {

      color: #6b7280;

      font-size: 11px;

      line-height: 1.4;
    }


    .place-card-description {

      margin-top: 13px;

      color: #4b5563;

      font-size: 12px;

      line-height: 1.55;
    }


    .place-card-actions {

      display: flex;

      gap: 8px;

      margin-top: 14px;
    }


    .place-action {

      flex: 1;

      min-height: 42px;

      border: 0;

      border-radius: 11px;

      cursor: pointer;

      font-size: 11px;

      font-weight: 850;
    }


    .place-action-primary {

      color: #ffffff;

      background: #ef4444;
    }


    .place-action-secondary {

      color: #374151;

      background: #f1f3f5;
    }


    /* =====================================================
       CUSTOM MARKERS
       ===================================================== */

    .sport-marker {

      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      background: #ffffff;

      border: 3px solid #ef4444;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.25);

      font-size: 20px;
    }


    .user-marker {

      width: 22px;

      height: 22px;

      border-radius: 50%;

      background: #2563eb;

      border: 4px solid #ffffff;

      box-shadow:
        0 3px 15px
        rgba(37,99,235,.45);
    }


    /* =====================================================
       LEAFLET OVERRIDES
       ===================================================== */

    .leaflet-control-zoom {

      margin-right: 12px !important;

      margin-top: 12px !important;

      border: 0 !important;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.14) !important;

      border-radius: 12px !important;

      overflow: hidden;
    }


    .leaflet-control-zoom a {

      width: 38px !important;

      height: 38px !important;

      line-height: 38px !important;

      color: #111827 !important;

      border: 0 !important;

      background: #ffffff !important;

      font-weight: 700;
    }


    .leaflet-control-attribution {

      font-size: 8px !important;

      background:
        rgba(255,255,255,.75) !important;
    }


    .leaflet-popup-content-wrapper {

      border-radius: 15px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.18);
    }


    .leaflet-popup-content {

      margin: 13px;

      font-family: inherit;
    }


    .popup-title {

      font-size: 14px;

      font-weight: 900;

      margin-bottom: 4px;
    }


    .popup-category {

      color: #ef4444;

      font-size: 9px;

      font-weight: 900;

      text-transform: uppercase;

      margin-bottom: 5px;
    }


    .popup-address {

      color: #6b7280;

      font-size: 10px;

      line-height: 1.4;
    }


    /* =====================================================
       MOBILE NAV
       ===================================================== */

    .mobile-nav {

      display: none;

      position: fixed;

      z-index: 3000;

      left: 0;
      right: 0;
      bottom: 0;

      height:
        calc(
          67px +
          env(safe-area-inset-bottom)
        );

      padding-bottom:
        env(safe-area-inset-bottom);

      background:
        rgba(11,15,20,.97);

      border-top:
        1px solid
        rgba(255,255,255,.08);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    .mobile-nav a {

      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 4px;

      color: #8d96a4;

      text-decoration: none;

      font-size: 9px;

      font-weight: 800;
    }


    .mobile-nav a span {

      font-size: 20px;

      line-height: 1;
    }


    .mobile-nav a.active {
      color: #ef4444;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .header {

        height:
          calc(
            58px +
            env(safe-area-inset-top)
          );
      }


      .header-inner {
        height: 58px;
        width: calc(100% - 20px);
      }


      .logo {
        font-size: 22px;
      }


      .desktop-nav,
      .header-actions {
        display: none;
      }


      .map-app {

        top:
          calc(
            58px +
            env(safe-area-inset-top)
          );

        bottom:
          calc(
            67px +
            env(safe-area-inset-bottom)
          );
      }


      .map-panel {

        top: 10px;

        left: 10px;

        width:
          calc(100% - 20px);
      }


      .search-box {

        min-height: 50px;

        border-radius: 14px;
      }


      #searchInput {
        height: 48px;
        font-size: 13px;
      }


      .filters {

        margin-right: -1px;

        padding-bottom: 3px;
      }


      .filter {

        min-height: 36px;

        padding: 0 11px;

        font-size: 10px;
      }


      .result-count {
        min-height: 31px;
      }


      .location-button {

        right: 12px;

        bottom: 14px;

        width: 48px;

        height: 48px;

        border-radius: 14px;
      }


      .map-info {
        display: none;
      }


      .place-card {

        left: 10px;

        right: 10px;

        bottom: 10px;

        width:
          calc(100% - 20px);

        border-radius: 18px;

        padding: 15px;
      }


      .place-card-actions {

        flex-direction: column;
      }


      .place-action {
        width: 100%;
      }


      .mobile-nav {
        display: flex;
      }


      .leaflet-control-zoom {

        margin-right: 10px !important;

        margin-top: 115px !important;
      }


      .leaflet-control-zoom a {

        width: 35px !important;

        height: 35px !important;

        line-height: 35px !important;
      }

    }


    @media (max-width: 390px) {

      .filter {
        padding: 0 9px;
      }


      .place-card h2 {
        font-size: 16px;
      }

    }


  </style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      Sport<span>Room</span>
    </a>


    <nav class="desktop-nav">

      <a href="index.html">
        Главная
      </a>

      <a href="sports.html">
        Виды спорта
      </a>

      <a
        href="map.html"
        class="active"
      >
        Карта
      </a>

      <a href="profile.html">
        Профиль
      </a>

    </nav>


    <div class="header-actions">

      <a
        href="login.html"
        class="header-button header-login"
      >
        Войти
      </a>

      <a
        href="register.html"
        class="header-button header-register"
      >
        Регистрация
      </a>

    </div>

  </div>

</header>


<!-- =====================================================
     MAP APPLICATION
     ===================================================== -->

<main class="map-app">


  <!-- MAP -->

  <div id="map"></div>


  <!-- SEARCH + FILTERS -->

  <div class="map-panel">

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="search"
        autocomplete="off"
        placeholder="Найти спортивное место..."
      >

      <button
        id="clearSearch"
        class="clear-search"
        type="button"
        aria-label="Очистить"
      >
        ×
      </button>

    </div>


    <div class="filters">

      <button
        class="filter active"
        data-category="all"
      >
        Все
      </button>

      <button
        class="filter"
        data-category="football"
      >
        ⚽ Футбол
      </button>

      <button
        class="filter"
        data-category="basketball"
      >
        🏀 Баскетбол
      </button>

      <button
        class="filter"
        data-category="tennis"
      >
        🎾 Теннис
      </button>

      <button
        class="filter"
        data-category="pool"
      >
        🏊 Бассейны
      </button>

      <button
        class="filter"
        data-category="gym"
      >
        🥊 Залы
      </button>

      <button
        class="filter"
        data-category="complex"
      >
        🏟️ Комплексы
      </button>

      <button
        class="filter"
        data-category="shop"
      >
        🏪 Магазины
      </button>

    </div>


    <div
      id="resultCount"
      class="result-count"
    >
      Загружаем спортивные места...
    </div>

  </div>


  <!-- LOCATION -->

  <button
    id="locationButton"
    class="location-button"
    type="button"
    title="Моё местоположение"
    aria-label="Моё местоположение"
  >
    📍
  </button>


  <!-- INFO -->

  <div class="map-info">

    Данные спортивных мест загружаются
    из открытой базы OpenStreetMap.

  </div>


  <!-- PLACE CARD -->

  <section
    id="placeCard"
    class="place-card"
  >

    <button
      id="placeCardClose"
      class="place-card-close"
      type="button"
    >
      ×
    </button>


    <div class="place-card-top">

      <div
        id="placeIcon"
        class="place-card-icon"
      >
        🏟️
      </div>


      <div>

        <div
          id="placeCategory"
          class="place-card-category"
        >
          Спортивный объект
        </div>

        <h2 id="placeName">
          Спортивный объект
        </h2>

        <div
          id="placeAddress"
          class="place-card-address"
        >
          Адрес не указан
        </div>

      </div>

    </div>


    <p
      id="placeDescription"
      class="place-card-description"
    >
      Спортивное место SportRoom.
    </p>


    <div class="place-card-actions">

      <button
        id="routeButton"
        class="place-action place-action-primary"
        type="button"
      >
        🧭 Маршрут
      </button>


      <button
        id="shareButton"
        class="place-action place-action-secondary"
        type="button"
      >
        📤 Поделиться
      </button>

    </div>

  </section>


</main>


<!-- =====================================================
     MOBILE NAV
     ===================================================== -->

<nav class="mobile-nav">

  <a href="index.html">

    <span>🏠</span>

    Главная

  </a>


  <a href="sports.html">

    <span>⚽</span>

    Спорт

  </a>


  <a
    href="map.html"
    class="active"
  >

    <span>🗺️</span>

    Карта

  </a>


  <a href="profile.html">

    <span>👤</span>

    Профиль

  </a>

</nav>


<!-- =====================================================
     LEAFLET
     ===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin=""
></script>


<script>

  /* =====================================================
     SPORTROOM MAP
     ===================================================== */


  const map = L.map("map", {

    zoomControl: true,

    attributionControl: true,

    preferCanvas: true

  });


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom: 19,

      attribution:
        '&copy; OpenStreetMap contributors'

    }

  ).addTo(map);


  /* =====================================================
     DEFAULT LOCATION
     ===================================================== */


  const DEFAULT_LOCATION = {

    lat: -36.8509,

    lon: 174.7645,

    zoom: 12

  };


  map.setView(

    [
      DEFAULT_LOCATION.lat,
      DEFAULT_LOCATION.lon
    ],

    DEFAULT_LOCATION.zoom

  );


  /* =====================================================
     VARIABLES
     ===================================================== */


  let allPlaces = [];

  let visiblePlaces = [];

  let markers = [];

  let currentCategory = "all";

  let currentSearch = "";

  let userMarker = null;

  let userAccuracyCircle = null;

  let selectedPlace = null;


  /* =====================================================
     CATEGORY CONFIG
     ===================================================== */


  const categoryConfig = {

    football: {

      icon: "⚽",

      name: "Футбол"

    },

    basketball: {

      icon: "🏀",

      name: "Баскетбол"

    },

    tennis: {

      icon: "🎾",

      name: "Теннис"

    },

    pool: {

      icon: "🏊",

      name: "Бассейн"

    },

    gym: {

      icon: "🥊",

      name: "Спортивный зал"

    },

    complex: {

      icon: "🏟️",

      name: "Спортивный комплекс"

    },

    shop: {

      icon: "🏪",

      name: "Спортивный магазин"

    },

    other: {

      icon: "🏆",

      name: "Спорт"

    }

  };


  /* =====================================================
     URL PARAMETERS
     ===================================================== */


  const urlParams =
    new URLSearchParams(
      window.location.search
    );


  const requestedPlace =
    urlParams.get("place");


  const requestedLat =
    parseFloat(
      urlParams.get("lat")
    );


  const requestedLon =
    parseFloat(
      urlParams.get("lon")
    );


  const requestedZoom =
    parseInt(
      urlParams.get("zoom") || "15",
      10
    );


  /* =====================================================
     HELPERS
     ===================================================== */


  function escapeHTML(value) {

    return String(value || "")

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function getCategoryFromTags(tags) {

    tags = tags || {};


    const sport =
      String(
        tags.sport || ""
      ).toLowerCase();


    const leisure =
      String(
        tags.leisure || ""
      ).toLowerCase();


    const shop =
      String(
        tags.shop || ""
      ).toLowerCase();


    if (
      sport.includes("soccer") ||
      sport.includes("football")
    ) {

      return "football";

    }


    if (
      sport.includes("basketball")
    ) {

      return "basketball";

    }


    if (
      sport.includes("tennis")
    ) {

      return "tennis";

    }


    if (
      sport.includes("swimming") ||
      sport.includes("swim")
    ) {

      return "pool";

    }


    if (
      leisure === "fitness_centre" ||
      leisure === "sports_centre" ||
      sport.includes("fitness") ||
      sport.includes("gym")
    ) {

      return "gym";

    }


    if (
      leisure === "sports_centre" ||
      leisure === "stadium" ||
      leisure === "sports_hall"
    ) {

      return "complex";

    }


    if (
      shop === "sports"
    ) {

      return "shop";

    }


    return "other";

  }


  function getPlaceName(element) {

    const tags =
      element.tags || {};


    return (

      tags.name ||

      tags["name:ru"] ||

      tags["name:en"] ||

      "Спортивное место"

    );

  }


  function getAddress(element) {

    const tags =
      element.tags || {};


    const parts = [];


    if (tags["addr:street"]) {

      parts.push(
        tags["addr:street"]
      );

    }


    if (tags["addr:housenumber"]) {

      parts.push(
        tags["addr:housenumber"]
      );

    }


    if (tags["addr:city"]) {

      parts.push(
        tags["addr:city"]
      );

    }


    return (

      parts.join(", ") ||

      tags["addr:full"] ||

      "Адрес не указан"

    );

  }


  function getCoordinates(element) {

    if (
      typeof element.lat === "number" &&
      typeof element.lon === "number"
    ) {

      return {
        lat: element.lat,
        lon: element.lon
      };

    }


    if (
      element.center &&
      typeof element.center.lat === "number" &&
      typeof element.center.lon === "number"
    ) {

      return {

        lat: element.center.lat,

        lon: element.center.lon

      };

    }


    return null;

  }


  /* =====================================================
     MARKER
     ===================================================== */


  function createMarker(place) {

    const config =
      categoryConfig[
        place.category
      ] ||
      categoryConfig.other;


    const icon =
      L.divIcon({

        className: "",

        html: `
          <div class="sport-marker">
            ${config.icon}
          </div>
        `,

        iconSize: [
          42,
          42
        ],

        iconAnchor: [
          21,
          21
        ],

        popupAnchor: [
          0,
          -23
        ]

      });


    const marker =
      L.marker(

        [
          place.lat,
          place.lon
        ],

        {
          icon: icon
        }

      );


    marker.placeData =
      place;


    marker.bindPopup(`

      <div class="popup-category">

        ${escapeHTML(
          config.name
        )}

      </div>

      <div class="popup-title">

        ${escapeHTML(
          place.name
        )}

      </div>

      <div class="popup-address">

        ${escapeHTML(
          place.address
        )}

      </div>

    `);


    marker.on(
      "click",
      function() {

        openPlace(
          place
        );

      }
    );


    return marker;

  }


  /* =====================================================
     DRAW MARKERS
     ===================================================== */


  function drawMarkers() {

    markers.forEach(
      marker => {

        map.removeLayer(
          marker
        );

      }
    );


    markers = [];


    visiblePlaces =
      allPlaces.filter(

        place => {

          const categoryMatch =

            currentCategory === "all" ||

            place.category ===
              currentCategory;


          const searchText =

            (
              place.name +
              " " +
              place.address +
              " " +
              place.categoryName
            ).toLowerCase();


          const searchMatch =

            !currentSearch ||

            searchText.includes(
              currentSearch
            );


          return (
            categoryMatch &&
            searchMatch
          );

        }

      );


    visiblePlaces.forEach(

      place => {

        const marker =
          createMarker(
            place
          );


        marker.addTo(
          map
        );


        markers.push(
          marker
        );

      }

    );


    document.getElementById(
      "resultCount"
    ).textContent =

      visiblePlaces.length +
      (
        visiblePlaces.length === 1
          ? " место"
          : " мест"
      );

  }


  /* =====================================================
     LOAD PLACES FROM OPENSTREETMAP
     ===================================================== */


  async function loadPlaces(
    lat,
    lon,
    radius = 8000
  ) {

    const resultCount =
      document.getElementById(
        "resultCount"
      );


    resultCount.textContent =
      "Ищем спортивные места...";


    const query = `

      [out:json][timeout:25];

      (

        node(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          leisure
        ];

        way(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          leisure
        ];

        relation(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          leisure
        ];

        node(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          sport
        ];

        way(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          sport
        ];

        node(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          shop=sports
        ];

        way(
          around:${radius},
          ${lat},
          ${lon}
        )
        [
          shop=sports
        ];

      );

      out center tags;

    `;


    try {

      const response =
        await fetch(

          "https://overpass-api.de/api/interpreter",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded"

            },

            body:
              "data=" +
              encodeURIComponent(
                query
              )

          }

        );


      if (!response.ok) {

        throw new Error(
          "Overpass error"
        );

      }


      const data =
        await response.json();


      const places = [];


      data.elements.forEach(

        element => {

          const coords =
            getCoordinates(
              element
            );


          if (!coords) {
            return;
          }


          const category =
            getCategoryFromTags(
              element.tags
            );


          const config =
            categoryConfig[
              category
            ] ||
            categoryConfig.other;


          places.push({

            id:
              String(
                element.type
              ) +
              "_" +
              String(
                element.id
              ),

            osmId:
              String(
                element.id
              ),

            osmType:
              element.type,

            name:
              getPlaceName(
                element
              ),

            address:
              getAddress(
                element
              ),

            category:
              category,

            categoryName:
              config.name,

            icon:
              config.icon,

            lat:
              coords.lat,

            lon:
              coords.lon,

            tags:
              element.tags || {}

          });

        }

      );


      /* REMOVE DUPLICATES */

      const unique =
        new Map();


      places.forEach(
        place => {

          const key =

            place.name +
            "_" +
            Math.round(
              place.lat * 10000
            ) +
            "_" +
            Math.round(
              place.lon * 10000
            );


          if (!unique.has(key)) {

            unique.set(
              key,
              place
            );

          }

        }
      );


      allPlaces =
        Array.from(
          unique.values()
        );


      drawMarkers();


      /* TRY TO OPEN REQUESTED PLACE */

      if (requestedPlace) {

        const found =
          allPlaces.find(

            place =>

              place.id ===
                requestedPlace ||

              place.osmId ===
                requestedPlace

          );


        if (found) {

          setTimeout(
            function() {

              openPlace(
                found
              );

              map.setView(

                [
                  found.lat,
                  found.lon
                ],

                17

              );

            },
            300
          );

        }

      }


    } catch (error) {

      console.error(
        error
      );


      resultCount.textContent =
        "Не удалось загрузить места";


      /*
        FALLBACK DEMO PLACE
      */

      allPlaces = [];


      drawMarkers();

    }

  }


  /* =====================================================
     OPEN PLACE
     ===================================================== */


  function openPlace(place) {

    selectedPlace =
      place;


    document.getElementById(
      "placeIcon"
    ).textContent =
      place.icon;


    document.getElementById(
      "placeCategory"
    ).textContent =
      place.categoryName;


    document.getElementById(
      "placeName"
    ).textContent =
      place.name;


    document.getElementById(
      "placeAddress"
    ).textContent =
      place.address;


    document.getElementById(
      "placeDescription"
    ).textContent =

      "Спортивное место, найденное через OpenStreetMap. Здесь можно посмотреть расположение объекта и построить маршрут.";


    document.getElementById(
      "placeCard"
    ).classList.add(
      "active"
    );


    /*
      Обновляем URL.

      Это позволяет отправить ссылку
      конкретного спортивного места.
    */

    const url =
      new URL(
        window.location.href
      );


    url.searchParams.set(
      "place",
      place.id
    );


    history.replaceState(
      {},
      "",
      url
    );

  }


  /* =====================================================
     CLOSE PLACE
     ===================================================== */


  document.getElementById(
    "placeCardClose"
  ).addEventListener(

    "click",

    function() {

      document.getElementById(
        "placeCard"
      ).classList.remove(
        "active"
      );


      selectedPlace =
        null;


      const url =
        new URL(
          window.location.href
        );


      url.searchParams.delete(
        "place"
      );


      history.replaceState(
        {},
        "",
        url
      );

    }

  );


  /* =====================================================
     ROUTE
     ===================================================== */


  document.getElementById(
    "routeButton"
  ).addEventListener(

    "click",

    function() {

      if (!selectedPlace) {
        return;
      }


      const lat =
        selectedPlace.lat;


      const lon =
        selectedPlace.lon;


      /*
        Google Maps
      */

      const url =

        "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(
          lat + "," + lon
        );


      window.open(
        url,
        "_blank"
      );

    }

  );


  /* =====================================================
     SHARE
     ===================================================== */


  document.getElementById(
    "shareButton"
  ).addEventListener(

    "click",

    async function() {

      if (!selectedPlace) {
        return;
      }


      const url =
        new URL(
          window.location.href
        );


      url.searchParams.set(
        "place",
        selectedPlace.id
      );


      const shareData = {

        title:
          selectedPlace.name,

        text:
          selectedPlace.categoryName +
          ": " +
          selectedPlace.name,

        url:
          url.toString()

      };


      try {

        if (
          navigator.share
        ) {

          await navigator.share(
            shareData
          );

        } else {

          await navigator.clipboard.writeText(
            url.toString()
          );


          alert(
            "Ссылка скопирована."
          );

        }

      } catch (error) {

        console.log(
          "Share cancelled"
        );

      }

    }

  );


  /* =====================================================
     SEARCH
     ===================================================== */


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const clearSearch =
    document.getElementById(
      "clearSearch"
    );


  searchInput.addEventListener(

    "input",

    function() {

      currentSearch =
        this.value
          .trim()
          .toLowerCase();


      clearSearch.style.display =

        currentSearch
          ? "flex"
          : "none";


      drawMarkers();

    }

  );


  clearSearch.addEventListener(

    "click",

    function() {

      searchInput.value = "";

      currentSearch = "";

      clearSearch.style.display =
        "none";

      drawMarkers();

      searchInput.focus();

    }

  );


  /* =====================================================
     FILTERS
     ===================================================== */


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(

      button => {

        button.addEventListener(

          "click",

          function() {

            document
              .querySelectorAll(
                ".filter"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            this.classList.add(
              "active"
            );


            currentCategory =
              this.dataset.category;


            drawMarkers();

          }

        );

      }

    );


  /* =====================================================
     GEOLOCATION
     ===================================================== */


  function locateUser() {

    if (
      !navigator.geolocation
    ) {

      alert(
        "Ваш браузер не поддерживает определение местоположения."
      );

      return;

    }


    const button =
      document.getElementById(
        "locationButton"
      );


    button.classList.add(
      "loading"
    );


    navigator.geolocation.getCurrentPosition(

      function(position) {

        button.classList.remove(
          "loading"
        );


        const lat =
          position.coords.latitude;


        const lon =
          position.coords.longitude;


        const accuracy =
          position.coords.accuracy;


        if (userMarker) {

          map.removeLayer(
            userMarker
          );

        }


        if (userAccuracyCircle) {

          map.removeLayer(
            userAccuracyCircle
          );

        }


        const userIcon =
          L.divIcon({

            className: "",

            html:
              '<div class="user-marker"></div>',

            iconSize: [
              22,
              22
            ],

            iconAnchor: [
              11,
              11
            ]

          });


        userMarker =
          L.marker(

            [
              lat,
              lon
            ],

            {
              icon:
                userIcon
            }

          ).addTo(
            map
          );


        userMarker.bindPopup(
          "Вы здесь 📍"
        );


        userAccuracyCircle =
          L.circle(

            [
              lat,
              lon
            ],

            {

              radius:
                accuracy,

              color:
                "#2563eb",

              fillColor:
                "#2563eb",

              fillOpacity:
                0.08,

              weight:
                1

            }

          ).addTo(
            map
          );


        map.setView(

          [
            lat,
            lon
          ],

          14

        );


        /*
          Загружаем спортивные места
          вокруг пользователя.
        */

        loadPlaces(
          lat,
          lon,
          8000
        );

      },


      function(error) {

        button.classList.remove(
          "loading"
        );


        let message =
          "Не удалось определить местоположение.";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          message =
            "Доступ к местоположению запрещён. Разрешите геолокацию в настройках браузера.";

        }


        if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          message =
            "Местоположение сейчас недоступно.";

        }


        alert(
          message
        );

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          60000

      }

    );

  }


  document.getElementById(
    "locationButton"
  ).addEventListener(

    "click",

    locateUser

  );


  /* =====================================================
     URL COORDINATES
     ===================================================== */


  if (
    Number.isFinite(
      requestedLat
    ) &&
    Number.isFinite(
      requestedLon
    )
  ) {

    map.setView(

      [
        requestedLat,
        requestedLon
      ],

      requestedZoom

    );


    loadPlaces(

      requestedLat,

      requestedLon,

      8000

    );

  } else {

    /*
      Загружаем карту вокруг
      Auckland по умолчанию.

      После получения геолокации
      карта автоматически переключится
      на пользователя.
    */

    loadPlaces(

      DEFAULT_LOCATION.lat,

      DEFAULT_LOCATION.lon,

      8000

    );

  }


  /* =====================================================
     MOBILE MAP RESIZE
     ===================================================== */


  setTimeout(

    function() {

      map.invalidateSize();

    },

    300

  );


  window.addEventListener(

    "resize",

    function() {

      map.invalidateSize();

    }

  );


  window.addEventListener(

    "orientationchange",

    function() {

      setTimeout(

        function() {

          map.invalidateSize();

        },

        400

      );

    }

  );


  /* =====================================================
     PREVENT ACCIDENTAL ZOOM / SCROLL ISSUES
     ===================================================== */


  document.addEventListener(

    "gesturestart",

    function(event) {

      if (
        event.target.closest(
          "#map"
        )
      ) {

        return;

      }

    }

  );


</script>


</body>
</html>
