<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta
    name="description"
    content="SportRoom — спортивные места рядом с вами"
  >

  <title>Карта — SportRoom</title>

  <style>
    :root {
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-light: #fff1f2;

      --text: #17191c;
      --muted: #73777d;
      --border: #e5e7eb;

      --white: #ffffff;
      --bg: #f5f6f8;

      --shadow:
        0 8px 30px rgba(0, 0, 0, .10);

      --shadow-lg:
        0 18px 55px rgba(0, 0, 0, .18);

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 68px;

      z-index: 1000;

      background: rgba(255, 255, 255, .94);

      border-bottom: 1px solid rgba(229, 231, 235, .9);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1200px, calc(100% - 30px));

      height: 100%;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      color: #111827;

      text-decoration: none;

      font-size: 25px;

      font-weight: 950;

      letter-spacing: -1.2px;

      white-space: nowrap;
    }

    .logo span {
      color: var(--red);
    }

    .nav {
      display: flex;

      align-items: center;

      gap: 4px;
    }

    .nav a {
      color: #555b63;

      text-decoration: none;

      padding: 9px 12px;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 750;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--red);

      background: var(--red-light);
    }

    .header-actions {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    .header-button {
      border: 1px solid var(--border);

      background: white;

      color: #333;

      padding: 9px 13px;

      border-radius: 10px;

      font-size: 13px;

      font-weight: 800;

      text-decoration: none;
    }

    .header-button.red {
      background: var(--red);

      color: white;

      border-color: var(--red);
    }

    /* =====================================================
       MAP
       ===================================================== */

    #map {
      position: fixed;

      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;

      background: #e9edf1;
    }

    /* =====================================================
       SEARCH PANEL
       ===================================================== */

    .map-top {
      position: fixed;

      top: 84px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 900;

      width: min(720px, calc(100% - 30px));
    }

    .search-box {
      display: flex;

      align-items: center;

      gap: 9px;

      padding: 7px;

      background: white;

      border: 1px solid rgba(0, 0, 0, .08);

      border-radius: 17px;

      box-shadow: var(--shadow-lg);
    }

    .search-icon {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 19px;

      color: #666;
    }

    #searchInput {
      flex: 1;

      min-width: 0;

      height: 42px;

      border: 0;

      outline: 0;

      background: transparent;

      color: #111;

      font-size: 15px;

      font-weight: 600;
    }

    #searchInput::placeholder {
      color: #92979e;
    }

    .search-button {
      height: 42px;

      padding: 0 17px;

      border: 0;

      border-radius: 11px;

      background: var(--red);

      color: white;

      font-size: 13px;

      font-weight: 850;
    }

    .search-button:hover {
      background: var(--red-dark);
    }

    /* =====================================================
       CATEGORIES
       ===================================================== */

    .categories {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding: 9px 2px;

      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;

      border: 1px solid rgba(0, 0, 0, .08);

      background: rgba(255, 255, 255, .96);

      color: #4c5158;

      border-radius: 999px;

      padding: 9px 13px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, .08);

      font-size: 12px;

      font-weight: 800;

      white-space: nowrap;

      transition: .18s ease;
    }

    .category:hover {
      transform: translateY(-1px);
    }

    .category.active {
      background: var(--red);

      border-color: var(--red);

      color: white;
    }

    /* =====================================================
       MAP CONTROLS
       ===================================================== */

    .map-controls {
      position: fixed;

      right: 18px;

      bottom: 28px;

      z-index: 800;

      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .map-control {
      width: 48px;

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      border: 0;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);

      font-size: 20px;

      color: #333;
    }

    .map-control:hover {
      background: #f8f8f8;
    }

    .map-control.location {
      color: var(--red);
    }

    /* =====================================================
       RESULT COUNTER
       ===================================================== */

    .result-counter {
      position: fixed;

      left: 18px;

      bottom: 28px;

      z-index: 800;

      background: rgba(255, 255, 255, .96);

      border: 1px solid rgba(0, 0, 0, .07);

      border-radius: 13px;

      padding: 11px 14px;

      box-shadow: var(--shadow);

      font-size: 12px;

      font-weight: 800;

      color: #555;
    }

    /* =====================================================
       PLACE CARD
       ===================================================== */

    .place-card {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translate(-50%, 25px);

      z-index: 950;

      width: min(470px, calc(100% - 30px));

      background: white;

      border-radius: 22px;

      box-shadow: var(--shadow-lg);

      border: 1px solid rgba(0, 0, 0, .08);

      padding: 18px;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .22s ease,
        transform .22s ease,
        visibility .22s ease;
    }

    .place-card.show {
      opacity: 1;

      visibility: visible;

      transform:
        translate(-50%, 0);
    }

    .place-close {
      position: absolute;

      top: 11px;

      right: 11px;

      width: 32px;
      height: 32px;

      border: 0;

      border-radius: 50%;

      background: #f2f3f5;

      color: #555;

      font-size: 19px;
    }

    .place-main {
      display: flex;

      gap: 13px;

      padding-right: 35px;
    }

    .place-icon {
      width: 53px;
      height: 53px;

      flex: 0 0 53px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 15px;

      background: var(--red-light);

      font-size: 27px;
    }

    .place-info {
      min-width: 0;
    }

    .place-name {
      margin-bottom: 4px;

      font-size: 17px;

      font-weight: 900;

      line-height: 1.2;
    }

    .place-address {
      color: var(--muted);

      font-size: 12px;

      line-height: 1.4;
    }

    .place-rating {
      margin-top: 7px;

      display: flex;

      align-items: center;

      gap: 6px;

      font-size: 12px;

      font-weight: 800;
    }

    .stars {
      color: #f59e0b;

      letter-spacing: 1px;
    }

    .place-actions {
      display: flex;

      gap: 8px;

      margin-top: 15px;
    }

    .place-action {
      flex: 1;

      min-height: 42px;

      border-radius: 11px;

      border: 1px solid var(--border);

      background: white;

      color: #333;

      font-size: 12px;

      font-weight: 850;
    }

    .place-action.primary {
      background: var(--red);

      color: white;

      border-color: var(--red);
    }

    .place-action.favorite.active {
      background: var(--red-light);

      color: var(--red);

      border-color: #fecaca;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      position: fixed;

      top: 155px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 850;

      display: flex;

      align-items: center;

      gap: 8px;

      background: rgba(255, 255, 255, .96);

      padding: 10px 14px;

      border-radius: 12px;

      box-shadow: var(--shadow);

      font-size: 12px;

      font-weight: 800;

      color: #555;

      opacity: 0;

      pointer-events: none;

      transition: opacity .2s ease;
    }

    .loading.show {
      opacity: 1;
    }

    .spinner {
      width: 16px;
      height: 16px;

      border: 2px solid #ddd;

      border-top-color: var(--red);

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       ERROR
       ===================================================== */

    .error-box {
      position: fixed;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 2000;

      width: min(450px, calc(100% - 30px));

      background: white;

      border-radius: 20px;

      box-shadow: var(--shadow-lg);

      padding: 25px;

      display: none;

      text-align: center;
    }

    .error-box.show {
      display: block;
    }

    .error-icon {
      font-size: 42px;

      margin-bottom: 12px;
    }

    .error-box h2 {
      margin-bottom: 8px;

      font-size: 21px;
    }

    .error-box p {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    .mobile-nav {
      display: none;
    }

    @media (max-width: 700px) {

      .header {
        height: 58px;
      }

      .header-inner {
        width: calc(100% - 20px);
      }

      .logo {
        font-size: 22px;
      }

      .nav {
        display: none;
      }

      .header-actions .header-button {
        padding: 8px 10px;

        font-size: 11px;
      }

      .header-actions .header-button:first-child {
        display: none;
      }

      #map {
        top: 58px;

        bottom: 66px;
      }

      .map-top {
        top: 70px;

        width: calc(100% - 16px);
      }

      .search-box {
        padding: 5px;

        border-radius: 15px;
      }

      .search-icon {
        width: 38px;
        height: 38px;

        flex-basis: 38px;
      }

      #searchInput {
        height: 38px;

        font-size: 14px;
      }

      .search-button {
        height: 38px;

        padding: 0 13px;
      }

      .categories {
        padding-top: 7px;
      }

      .category {
        padding: 8px 11px;

        font-size: 11px;
      }

      .map-controls {
        right: 12px;

        bottom: 80px;
      }

      .map-control {
        width: 45px;
        height: 45px;
      }

      .result-counter {
        left: 12px;

        bottom: 80px;
      }

      .place-card {
        bottom: 76px;

        width: calc(100% - 18px);

        border-radius: 20px;

        padding: 15px;
      }

      .place-actions {
        gap: 7px;
      }

      .place-action {
        min-height: 40px;

        font-size: 11px;
      }

      .loading {
        top: 148px;
      }

      .mobile-nav {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        height: 66px;

        z-index: 1200;

        display: grid;

        grid-template-columns:
          repeat(4, 1fr);

        background: rgba(255, 255, 255, .97);

        border-top: 1px solid var(--border);

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        padding-bottom:
          env(safe-area-inset-bottom);
      }

      .mobile-nav a {
        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 3px;

        color: #70757c;

        text-decoration: none;

        font-size: 10px;

        font-weight: 800;
      }

      .mobile-nav a span {
        font-size: 20px;
      }

      .mobile-nav a.active {
        color: var(--red);
      }
    }

    @media (max-width: 380px) {

      .header-actions .header-button.red {
        display: none;
      }

      .search-button {
        font-size: 0;

        width: 42px;

        padding: 0;
      }

      .search-button::before {
        content: "⌕";

        font-size: 20px;
      }
    }
  </style>
</head>

  <script>

    /*
     * =====================================================
     * SPORTROOM GOOGLE MAPS CONFIG
     * =====================================================
     *
     * ВСТАВЬ СЮДА СВОЙ GOOGLE MAPS API KEY.

     */

    const GOOGLE_MAPS_API_KEY =
      "AIzaSyB_bQiNk4fNuqCfruVAliJmXq2QZpeF88U";


    /*
     * Google рекомендует динамически загружать
     * необходимые библиотеки через importLibrary().
     */

    (g => {

      var h,
          a,
          k,
          p = "The Google Maps JavaScript API",
          c = "google",
          l = "importLibrary",
          q = "__ib__",
          m = document,
          b = window;

      b = b[c] || (b[c] = {});

      var d = b.maps || (b.maps = {});

      var r = new Set();

      var e = new URLSearchParams();

      var u = () =>
        h ||
        (h = new Promise(
          async (f, n) => {

            await (
              a = m.createElement("script")
            );

            e.set(
              "libraries",
              [...r] + ""
            );

            for (k in g) {

              e.set(
                k.replace(
                  /[A-Z]/g,
                  t => "_" + t[0].toLowerCase()
                ),
                g[k]
              );

            }

            e.set(
              "callback",
              c + ".maps." + q
            );

            a.src =
              "https://maps.googleapis.com/maps/api/js?" +
              e.toString();

            d[q] = f;

            a.onerror = () =>
              h = n(
                Error(
                  p + " could not load."
                )
              );

            a.nonce =
              document
                .querySelector("script[nonce]")
                ?.nonce || "";

            m.head.append(a);

          }
        ));

      d[l] ?
        console.warn(
          p +
          " only loads once. Ignoring:",
          g
        ) :
        d[l] = (
          ...n
        ) =>
          r.add(...n) &&
          u().then(
            () => d[l](...n)
          );

    })({

      key:
        GOOGLE_MAPS_API_KEY,

      v:
        "weekly"

    });

  </script>

        "sports facilities",

      gym:
        "gym",

      stadium:
        "stadium",

      soccer:
        "soccer football field",

      basketball:
        "basketball court",

      tennis:
        "tennis court",

      swimming:
        "swimming pool",

      boxing:
        "boxing martial arts gym",

      golf:
        "golf course",

      cycling:
        "cycling sports"

    };


    /*
     * Иконки категорий.
     */

    const CATEGORY_ICONS = {

      sports: "🏆",

      gym: "🏋️",

      stadium: "🏟️",

      soccer: "⚽",

      basketball: "🏀",

      tennis: "🎾",

      swimming: "🏊",

      boxing: "🥊",

      golf: "⛳",

      cycling: "🚴"

    };


    /*
     * DOM
     */

    const loading =
      document.getElementById(
        "loading"
      );

    const resultCounter =
      document.getElementById(
        "resultCounter"
      );

    const placeCard =
      document.getElementById(
        "placeCard"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchButton =
      document.getElementById(
        "searchButton"
      );


    /*
     * =====================================================
     * HELPERS
     * =====================================================
     */

    function showLoading(
      value
    ) {

      loading.classList.toggle(
        "show",
        value
      );

    }


    function showError(
      title,
      text
    ) {

      document.getElementById(
        "errorTitle"
      ).textContent = title;

      document.getElementById(
        "errorText"
      ).textContent = text;

      document
        .getElementById("errorBox")
        .classList.add("show");

    }


    function hideError() {

      document
        .getElementById("errorBox")
        .classList.remove("show");

    }


    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * =====================================================
     * INIT MAP
     * =====================================================
     */

    async function initSportRoomMap() {

      if (
        !GOOGLE_MAPS_API_KEY ||
        GOOGLE_MAPS_API_KEY.includes(
          "ВСТАВЬ"
        )
      ) {

        showError(
          "Нужен Google Maps API Key",
          "Открой код map.html и вставь свой ключ в GOOGLE_MAPS_API_KEY."
        );

        return;

      }


      try {

        hideError();

        /*
         * Загружаем библиотеки параллельно.
         * Это уменьшает время ожидания.
         */

        const [
          mapsLibrary,
          placesLibrary,
          markerLibrary
        ] = await Promise.all([

          google.maps.importLibrary(
            "maps"
          ),

          google.maps.importLibrary(
            "places"
          ),

          google.maps.importLibrary(
            "marker"
          )

        ]);


        const {
          Map
        } = mapsLibrary;

        const {
          AdvancedMarkerElement,
          PinElement
        } = markerLibrary;


        /*
         * Создаём карту.
         */

        map = new Map(
          document.getElementById(
            "map"
          ),
          {

            center:
              DEFAULT_CENTER,

            zoom:
              13,

            mapId:
              "DEMO_MAP_ID",

            streetViewControl:
              false,

            mapTypeControl:
              false,

            fullscreenControl:
              false,

            clickableIcons:
              true,

            gestureHandling:
              "greedy"

          }
        );


        /*
         * Сохраняем классы Places.
         */

        window.SportRoomPlace =
          placesLibrary.Place;

        window.SportRoomMarker =
          AdvancedMarkerElement;

        window.SportRoomPin =
          PinElement;


        /*
         * Первоначальный поиск.
         */

        await searchSportsPlaces();

        /*
         * Попытка определить пользователя.
         */

        locateUser(
          false
        );


        /*
         * Если пользователь двигает карту,
         * не отправляем запрос мгновенно.
         */

        map.addListener(
          "idle",
          function() {

            clearTimeout(
              searchTimer
            );

            searchTimer =
              setTimeout(
                () => {

                  if (
                    currentCategory !==
                    "sports"
                  ) {

                    searchSportsPlaces(
                      false
                    );

                  }

                },
                700
              );

          }
        );


      } catch (error) {

        console.error(
          error
        );

        showError(
          "Ошибка Google Maps",
          "Проверь API Key, billing и включённые Maps JavaScript API / Places API / Places API (New)."
        );

      }

    }


    /*
     * =====================================================
     * SEARCH PLACES
     * =====================================================
     */

    async function searchSportsPlaces(
      moveMap = false
    ) {

      if (!map) {
        return;
      }


      showLoading(true);


      try {

        const Place =
          window.SportRoomPlace;


        const center =
          map.getCenter();


        const query =
          CATEGORY_QUERIES[
            currentCategory
          ] ||
          CATEGORY_QUERIES.sports;


        /*
         * Для версии 1.0 используем
         * Text Search (New).
         *
         * Ограничиваем количество результатов,
         * чтобы карта была быстрой.
         */

        const request = {

          textQuery:
            query,

          fields: [

            "id",

            "displayName",

            "location",

            "formattedAddress",

            "rating",

            "userRatingCount",

            "businessStatus",

            "googleMapsURI"

          ],

          locationBias: {

            center:
              center,

            radius:
              8000

          },

          maxResultCount:
            20,

          language:
            "ru",

          region:
            "nz"

        };


        const response =
          await Place.searchByText(
            request
          );


        const places =
          response.places || [];


        clearMarkers();


        /*
         * Отображаем результаты.
         */

        for (
          const place of places
        ) {

          if (
            !place.location
          ) {
            continue;
          }


          addPlaceMarker(
            place
          );

        }


        resultCounter.textContent =
          places.length
            ? `${places.length} мест`
            : "Ничего не найдено";


        if (
          moveMap &&
          places.length
        ) {

          fitPlaces(
            places
          );

        }


      } catch (error) {

        console.error(
          "Place search error:",
          error
        );

        resultCounter.textContent =
          "Ошибка поиска";

      } finally {

        showLoading(false);

      }

    }


    /*
     * =====================================================
     * SEARCH BY USER QUERY
     * =====================================================
     */

    async function searchByText() {

      const query =
        searchInput.value.trim();


      if (!query) {

        await searchSportsPlaces(
          true
        );

        return;

      }


      showLoading(true);


      try {

        const Place =
          window.SportRoomPlace;


        const center =
          map.getCenter();


        const response =
          await Place.searchByText({

            textQuery:
              query,

            fields: [

              "id",

              "displayName",

              "location",

              "formattedAddress",

              "rating",

              "userRatingCount",

              "businessStatus",

              "googleMapsURI"

            ],

            locationBias: {

              center:
                center,

              radius:
                10000

            },

            maxResultCount:
              20,

            language:
              "ru",

            region:
              "nz"

          });


        const places =
          response.places || [];


        clearMarkers();


        for (
          const place of places
        ) {

          if (
            place.location
          ) {

            addPlaceMarker(
              place
            );

          }

        }


        resultCounter.textContent =
          places.length
            ? `${places.length} мест`
            : "Ничего не найдено";


        if (
          places.length
        ) {

          fitPlaces(
            places
          );

        }


      } catch (error) {

        console.error(
          error
        );

        resultCounter.textContent =
          "Ошибка поиска";

      } finally {

        showLoading(false);

      }

    }


    /*
     * =====================================================
     * MARKERS
     * =====================================================
     */

    function addPlaceMarker(
      place
    ) {

      const icon =
        CATEGORY_ICONS[
          currentCategory
        ] ||
        "🏆";


      const pin =
        new window.SportRoomPin({

          glyph:
            icon,

          background:
            "#ef4444",

          borderColor:
            "#ffffff",

          glyphColor:
            "#ffffff",

          scale:
            1.05

        });


      const marker =
        new window.SportRoomMarker({

          map:
            map,

          position:
            place.location,

          title:
            place.displayName,

          content:
            pin.element,

          collisionBehavior:
            "OPTIONAL_AND_HIDES_LOWER_PRIORITY"

        });


      marker.addListener(
        "click",
        async () => {

          await openPlace(
            place
          );

        }
      );


      markers.push(
        marker
      );

    }


    function clearMarkers() {

      for (
        const marker of markers
      ) {

        marker.map = null;

      }

      markers = [];

    }


    function fitPlaces(
      places
    ) {

      if (
        places.length === 0
      ) {
        return;
      }


      const bounds =
        new google.maps.LatLngBounds();


      for (
        const place of places
      ) {

        if (
          place.location
        ) {

          bounds.extend(
            place.location
          );

        }

      }


      map.fitBounds(
        bounds,
        70
      );

    }


    /*
     * =====================================================
     * PLACE CARD
     * =====================================================
     */

    async function openPlace(
      place
    ) {

      selectedPlace =
        place;


      const name =
        place.displayName ||
        "Спортивное место";


      document.getElementById(
        "placeName"
      ).textContent =
        name;


      document.getElementById(
        "placeAddress"
      ).textContent =
        place.formattedAddress ||
        "Адрес не указан";


      const rating =
        place.rating;


      const ratingCount =
        place.userRatingCount;


      if (
        rating
      ) {

        document.getElementById(
          "placeRating"
        ).innerHTML = `

          <span class="stars">
            ★★★★★
          </span>

          <span>
            ${escapeHtml(
              rating
            )}
          </span>

          ${
            ratingCount
              ? `
                <span style="color:#888;">
                  (${escapeHtml(
                    ratingCount
                  )})
                </span>
              `
              : ""
          }

        `;

      } else {

        document.getElementById(
          "placeRating"
        ).innerHTML =
          "Рейтинг пока недоступен";

      }


      document.getElementById(
        "placeIcon"
      ).textContent =
        CATEGORY_ICONS[
          currentCategory
        ] ||
        "🏆";


      updateFavoriteButton();


      placeCard.classList.add(
        "show"
      );


      /*
       * Пытаемся показать
       * более подробные данные.
       */

      try {

        if (
          place.fetchFields
        ) {

          await place.fetchFields({

            fields: [

              "displayName",

              "formattedAddress",

              "rating",

              "userRatingCount",

              "googleMapsURI",

              "nationalPhoneNumber",

              "regularOpeningHours"

            ]

          });


          document.getElementById(
            "placeName"
          ).textContent =
            place.displayName ||
            name;


          document.getElementById(
            "placeAddress"
          ).textContent =
            place.formattedAddress ||
            "Адрес не указан";

        }

      } catch (error) {

        console.warn(
          "Place details:",
          error
        );

      }

    }


    /*
     * =====================================================
     * FAVORITES
     * =====================================================
     */

    function getFavorites() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "sportroom_favorites"
          ) || "[]"
        );

      } catch {

        return [];

      }

    }


    function saveFavorites(
      favorites
    ) {

      localStorage.setItem(
        "sportroom_favorites",
        JSON.stringify(
          favorites
        )
      );

    }


    function placeId() {

      return selectedPlace?.id ||
        selectedPlace?.name ||
        "";

    }


    function isFavorite() {

      const favorites =
        getFavorites();


      return favorites.some(
        item =>
          item.id === placeId()
      );

    }


    function updateFavoriteButton() {

      const button =
        document.getElementById(
          "favoriteButton"
        );


      if (
        isFavorite()
      ) {

        button.classList.add(
          "active"
        );

        button.textContent =
          "♥ В избранном";

      } else {

        button.classList.remove(
          "active"
        );

        button.textContent =
          "♡ В избранное";

      }

    }


    function toggleFavorite() {

      if (
        !selectedPlace
      ) {
        return;
      }


      const favorites =
        getFavorites();


      const id =
        placeId();


      const existing =
        favorites.findIndex(
          item =>
            item.id === id
        );


      if (
        existing >= 0
      ) {

        favorites.splice(
          existing,
          1
        );

      } else {

        favorites.push({

          id:
            id,

          name:
            selectedPlace.displayName ||
            "Спортивное место",

          address:
            selectedPlace.formattedAddress ||
            "",

          rating:
            selectedPlace.rating ||
            null,

          lat:
            selectedPlace.location?.lat(),

          lng:
            selectedPlace.location?.lng(),

          savedAt:
            Date.now()

        });

      }


      saveFavorites(
        favorites
      );


      updateFavoriteButton();

    }


    /*
     * =====================================================
     * ROUTE
     * =====================================================
     */

    function openRoute() {

      if (
        !selectedPlace ||
        !selectedPlace.location
      ) {
        return;
      }


      const lat =
        selectedPlace.location.lat();


      const lng =
        selectedPlace.location.lng();


      /*
       * Google Maps URL.
       *
       * Работает на телефоне и компьютере.
       */

      const url =
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;


      window.open(
        url,
        "_blank",
        "noopener"
      );

    }


    /*
     * =====================================================
     * DETAILS
     * =====================================================
     */

    function openDetails() {

      if (
        !selectedPlace
      ) {
        return;
      }


      if (
        selectedPlace.googleMapsURI
      ) {

        window.open(
          selectedPlace.googleMapsURI,
          "_blank",
          "noopener"
        );

        return;

      }


      openRoute();

    }


    /*
     * =====================================================
     * GEOLOCATION
     * =====================================================
     */

    function locateUser(
      showMessage = true
    ) {

      if (
        !navigator.geolocation
      ) {

        if (
          showMessage
        ) {

          alert(
            "Геолокация не поддерживается вашим браузером."
          );

        }

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          userLocation = {
            lat,
            lng
          };


          if (
            userMarker
          ) {

            userMarker.map =
              null;

          }


          const pin =
            new window.SportRoomPin({

              glyph:
                "●",

              background:
                "#2563eb",

              borderColor:
                "#ffffff",

              glyphColor:
                "#ffffff",

              scale:
                1.1

            });


          userMarker =
            new window.SportRoomMarker({

              map:
                map,

              position:
                userLocation,

              title:
                "Моё местоположение",

              content:
                pin.element

            });


          map.panTo(
            userLocation
          );


          map.setZoom(
            14
          );


          /*
           * После определения пользователя
           * ищем спортивные места рядом.
           */

          searchSportsPlaces(
            false
          );

        },

        error => {

          console.warn(
            "Geolocation:",
            error
          );

          if (
            showMessage
          ) {

            alert(
              "Не удалось определить местоположение. Проверь разрешение геолокации."
            );

          }

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            120000

        }

      );

    }


    /*
     * =====================================================
     * EVENTS
     * =====================================================
     */

    searchButton.addEventListener(
      "click",
      searchByText
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          searchByText();

        }

      }
    );


    /*
     * Небольшой debounce
     * для быстрого поиска.
     */

    searchInput.addEventListener(
      "input",
      () => {

        clearTimeout(
          searchTimer
        );


        if (
          searchInput.value.trim().length < 3
        ) {

          return;

        }


        searchTimer =
          setTimeout(
            searchByText,
            650
          );

      }
    );


    /*
     * Категории.
     */

    document
      .querySelectorAll(
        ".category"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            async () => {

              document
                .querySelectorAll(
                  ".category"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              currentCategory =
                button.dataset.query;


              searchInput.value =
                "";


              await searchSportsPlaces(
                true
              );

            }
          );

        }
      );


    /*
     * Location.
     */

    document
      .getElementById(
        "locationButton"
      )
      .addEventListener(
        "click",
        () =>
          locateUser(
            true
          )
      );


    /*
     * Zoom.
     */

    document
      .getElementById(
        "zoomIn"
      )
      .addEventListener(
        "click",
        () => {

          if (
            map
          ) {

            map.setZoom(
              map.getZoom() + 1
            );

          }

        }
      );


    document
      .getElementById(
        "zoomOut"
      )
      .addEventListener(
        "click",
        () => {

          if (
            map
          ) {

            map.setZoom(
              map.getZoom() - 1
            );

          }

        }
      );


    /*
     * Place card.
     */

    document
      .getElementById(
        "placeClose"
      )
      .addEventListener(
        "click",
        () => {

          placeCard.classList.remove(
            "show"
          );

        }
      );


    document
      .getElementById(
        "favoriteButton"
      )
      .addEventListener(
        "click",
        toggleFavorite
      );


    document
      .getElementById(
        "routeButton"
      )
      .addEventListener(
        "click",
        openRoute
      );


    document
      .getElementById(
        "detailsButton"
      )
      .addEventListener(
        "click",
        openDetails
      );


    /*
     * Escape закрывает карточку.
     */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          placeCard.classList.remove(
            "show"
          );

        }

      }
    );


    /*
     * =====================================================
     * URL PARAMETERS
     * =====================================================
     *
     * Можно открыть:
     *
     * map.html?lat=-36.85&lng=174.76&zoom=15
     *
     * Это пригодится для ссылок
     * из Telegram / WhatsApp / Messenger.
     */

    function applyUrlLocation() {

      if (!map) {
        return;
      }


      const params =
        new URLSearchParams(
          window.location.search
        );


      const lat =
        parseFloat(
          params.get("lat")
        );


      const lng =
        parseFloat(
          params.get("lng")
        );


      const zoom =
        parseInt(
          params.get("zoom")
        );


      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ) {

        map.setCenter({
          lat,
          lng
        });


        if (
          Number.isFinite(zoom)
        ) {

          map.setZoom(
            Math.min(
              Math.max(
                zoom,
                3
              ),
              20
            )
          );

        }

      }

    }


    /*
     * =====================================================
     * START
     * =====================================================
     */

    window.initSportRoomMap =
      initSportRoomMap;


    google.maps.importLibrary(
      "maps"
    )
    .then(
      initSportRoomMap
    )
    .catch(
      error => {

        console.error(
          error
        );

        showError(
          "Google Maps не загрузилась",
          "Проверь API Key и ограничения ключа в Google Cloud."
        );

      }
    );

  </script>

</body>
</html>
