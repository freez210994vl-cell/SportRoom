<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="SportRoom — спортивные комплексы, площадки, бассейны, фитнес-клубы и другие спортивные места рядом с вами."
  >

  <title>Карта — SportRoom</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #ef4444;
      --red-dark: #dc2626;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --white: #ffffff;
      --shadow: 0 8px 30px rgba(0,0,0,.12);
      --radius: 16px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: var(--text);
      background: #f3f4f6;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      z-index: 2000;

      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .header-inner {
      height: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 0 18px;

      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      text-decoration: none;
      color: #111;
      font-size: 24px;
      font-weight: 900;
      white-space: nowrap;
    }

    .logo span {
      color: var(--red);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav a {
      text-decoration: none;
      color: #555;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
    }

    .nav a:hover,
    .nav a.active {
      background: #fff1f2;
      color: var(--red);
    }

    .header-space {
      flex: 1;
    }

    .profile-link {
      text-decoration: none;
      color: #111;
      background: #f3f4f6;
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    /* =====================================================
       MAP
       ===================================================== */

    #map {
      position: fixed;
      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* =====================================================
       SEARCH
       ===================================================== */

    .search-panel {
      position: fixed;
      top: 84px;
      left: 20px;
      width: min(430px, calc(100% - 40px));
      z-index: 1500;
    }

    .search-box {
      display: flex;
      align-items: center;

      width: 100%;
      height: 56px;

      padding: 0 15px;

      background: white;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 15px;

      box-shadow: var(--shadow);
    }

    .search-icon {
      font-size: 20px;
      margin-right: 10px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;

      border: 0;
      outline: 0;

      background: transparent;

      font-family: inherit;
      font-size: 15px;
    }

    .clear-search {
      width: 30px;
      height: 30px;

      border: 0;
      border-radius: 50%;

      background: #f3f4f6;
      color: #555;

      cursor: pointer;
      display: none;
    }

    /* =====================================================
       FILTERS
       ===================================================== */

    .filters {
      display: flex;
      gap: 8px;

      margin-top: 10px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex-shrink: 0;

      border: 1px solid rgba(0,0,0,.07);
      background: white;

      padding: 9px 13px;

      border-radius: 22px;

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 4px 14px rgba(0,0,0,.08);

      transition: .2s;
    }

    .filter:hover {
      transform: translateY(-1px);
    }

    .filter.active {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    /* =====================================================
       LOCATION BUTTON
       ===================================================== */

    .map-controls {
      position: fixed;

      right: 20px;
      bottom: 30px;

      z-index: 1500;

      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .map-control {
      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);

      font-size: 20px;

      cursor: pointer;

      transition: .2s;
    }

    .map-control:hover {
      transform: translateY(-2px);
    }

    /* =====================================================
       COUNTER
       ===================================================== */

    .results-counter {
      position: fixed;

      left: 20px;
      bottom: 25px;

      z-index: 1500;

      padding: 10px 14px;

      background: rgba(255,255,255,.95);

      border-radius: 12px;

      box-shadow: 0 5px 20px rgba(0,0,0,.1);

      font-size: 12px;
      font-weight: 800;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      z-index: 2000;

      display: none;
      align-items: center;
      gap: 9px;

      padding: 11px 16px;

      background: rgba(17,24,39,.94);
      color: white;

      border-radius: 30px;

      font-size: 12px;
      font-weight: 700;
    }

    .loading.active {
      display: flex;
    }

    .spinner {
      width: 15px;
      height: 15px;

      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       PLACE CARD
       ===================================================== */

    .place-popup {
      width: 285px;
    }

    .place-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .place-type {
      display: inline-block;

      margin-bottom: 9px;

      padding: 5px 8px;

      border-radius: 8px;

      background: #fff1f2;
      color: var(--red);

      font-size: 10px;
      font-weight: 900;
    }

    .place-address {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .place-actions {
      display: flex;
      gap: 7px;
    }

    .place-btn {
      flex: 1;

      padding: 9px 8px;

      border: 0;
      border-radius: 9px;

      cursor: pointer;

      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
    }

    .place-btn.route {
      background: var(--red);
      color: white;
    }

    .place-btn.favorite {
      background: #f3f4f6;
      color: #333;
    }

    /* =====================================================
       MARKER
       ===================================================== */

    .sport-marker {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);

      background: var(--red);

      border: 3px solid white;

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);
    }

    .sport-marker span {
      transform: rotate(45deg);
      font-size: 17px;
    }

    .user-marker {
      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: #4285f4;

      border: 4px solid white;

      box-shadow:
        0 0 0 6px rgba(66,133,244,.25),
        0 3px 12px rgba(0,0,0,.25);
    }

    /* =====================================================
       LEAFLET
       ===================================================== */

    .leaflet-control-zoom {
      display: none !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 15px;
    }

    .leaflet-popup-content {
      margin: 15px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .header {
        height: 58px;
      }

      .header-inner {
        padding: 0 13px;
      }

      .logo {
        font-size: 21px;
      }

      .nav {
        display: none;
      }

      .profile-link {
        font-size: 11px;
        padding: 8px 10px;
      }

      #map {
        top: 58px;
      }

      .search-panel {
        top: 70px;
        left: 10px;
        width: calc(100% - 20px);
      }

      .search-box {
        height: 52px;
      }

      .filters {
        margin-top: 8px;
      }

      .filter {
        padding: 8px 11px;
        font-size: 11px;
      }

      .map-controls {
        right: 12px;
        bottom: 75px;
      }

      .map-control {
        width: 45px;
        height: 45px;
      }

      .results-counter {
        left: 10px;
        bottom: 15px;
      }

      .loading {
        bottom: 15px;
      }

      .place-popup {
        width: 245px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      Sport<span>Room</span>
    </a>

    <nav class="nav">

      <a href="index.html">
        Главная
      </a>

      <a href="sports.html">
        Виды спорта
      </a>

      <a
        href="map.html"
        class="active"
      >
        Карта
      </a>

      <a href="profile.html">
        Профиль
      </a>

    </nav>

    <div class="header-space"></div>

    <a
      href="profile.html"
      class="profile-link"
    >
      👤 Профиль
    </a>

  </div>

</header>


<!-- =====================================================
     MAP
     ===================================================== -->

<div id="map"></div>


<!-- =====================================================
     SEARCH
     ===================================================== -->

<div class="search-panel">

  <div class="search-box">

    <span class="search-icon">
      🔎
    </span>

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Поиск спортивных мест..."
    >

    <button
      class="clear-search"
      id="clearSearch"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="filters">

    <button
      class="filter active"
      data-type="all"
    >
      Все
    </button>

    <button
      class="filter"
      data-type="gym"
    >
      🏋️ Фитнес
    </button>

    <button
      class="filter"
      data-type="football"
    >
      ⚽ Футбол
    </button>

    <button
      class="filter"
      data-type="basketball"
    >
      🏀 Баскетбол
    </button>

    <button
      class="filter"
      data-type="tennis"
    >
      🎾 Теннис
    </button>

    <button
      class="filter"
      data-type="swimming"
    >
      🏊 Бассейны
    </button>

    <button
      class="filter"
      data-type="martial"
    >
      🥊 Единоборства
    </button>

    <button
      class="filter"
      data-type="other"
    >
      🏟️ Другое
    </button>

  </div>

</div>


<!-- =====================================================
     MAP CONTROLS
     ===================================================== -->

<div class="map-controls">

  <button
    class="map-control"
    id="locateButton"
    title="Моё местоположение"
  >
    📍
  </button>

  <button
    class="map-control"
    id="zoomIn"
    title="Увеличить"
  >
    +
  </button>

  <button
    class="map-control"
    id="zoomOut"
    title="Уменьшить"
  >
    −
  </button>

</div>


<!-- =====================================================
     COUNTER
     ===================================================== -->

<div class="results-counter">

  Найдено:
  <span id="resultsCount">0</span>

</div>


<!-- =====================================================
     LOADING
     ===================================================== -->

<div
  class="loading"
  id="loading"
>

  <span class="spinner"></span>

  Загружаем спортивные места...

</div>


<!-- =====================================================
     LEAFLET
     ===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
   CONFIG
   ===================================================== */

const CONFIG = {

  defaultLat: -36.8509,

  defaultLng: 174.7645,

  defaultZoom: 12,

  searchDelay: 500

};


/* =====================================================
   SPORT TYPES
   ===================================================== */

const SPORT_TYPES = {

  gym: {
    icon: "🏋️",
    label: "Фитнес",
    tags: [
      "leisure=fitness_centre",
      "sport=fitness"
    ]
  },

  football: {
    icon: "⚽",
    label: "Футбол",
    tags: [
      "sport=football"
    ]
  },

  basketball: {
    icon: "🏀",
    label: "Баскетбол",
    tags: [
      "sport=basketball"
    ]
  },

  tennis: {
    icon: "🎾",
    label: "Теннис",
    tags: [
      "sport=tennis"
    ]
  },

  swimming: {
    icon: "🏊",
    label: "Бассейн",
    tags: [
      "sport=swimming",
      "leisure=swimming_pool"
    ]
  },

  martial: {
    icon: "🥊",
    label: "Единоборства",
    tags: [
      "sport=martial_arts",
      "sport=boxing",
      "sport=judo",
      "sport=karate"
    ]
  },

  other: {
    icon: "🏟️",
    label: "Спорт",
    tags: []
  }

};


/* =====================================================
   MAP
   ===================================================== */

const map = L.map(
  "map",
  {
    zoomControl: false,
    preferCanvas: true
  }
).setView(
  [
    CONFIG.defaultLat,
    CONFIG.defaultLng
  ],
  CONFIG.defaultZoom
);


/* =====================================================
   MAP TILES
   ===================================================== */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =====================================================
   MARKER LAYER
   ===================================================== */

const markerLayer =
  L.layerGroup().addTo(map);


/* =====================================================
   VARIABLES
   ===================================================== */

let places = [];

let activeType = "all";

let searchTimer = null;

let userMarker = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const clearSearch =
  document.getElementById(
    "clearSearch"
  );

const resultsCount =
  document.getElementById(
    "resultsCount"
  );

const loading =
  document.getElementById(
    "loading"
  );


/* =====================================================
   LOADING
   ===================================================== */

function setLoading(value) {

  loading.classList.toggle(
    "active",
    value
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   DETERMINE SPORT TYPE
   ===================================================== */

function detectSportType(tags) {

  const text = (

    (tags.sport || "") +
    " " +
    (tags.leisure || "") +
    " " +
    (tags.name || "")

  ).toLowerCase();


  if (
    text.includes("football")
  ) {
    return "football";
  }


  if (
    text.includes("basketball")
  ) {
    return "basketball";
  }


  if (
    text.includes("tennis")
  ) {
    return "tennis";
  }


  if (
    text.includes("swimming") ||
    text.includes("pool")
  ) {
    return "swimming";
  }


  if (
    text.includes("boxing") ||
    text.includes("martial") ||
    text.includes("judo") ||
    text.includes("karate")
  ) {
    return "martial";
  }


  if (
    text.includes("fitness") ||
    text.includes("gym")
  ) {
    return "gym";
  }


  return "other";

}


/* =====================================================
   ICON
   ===================================================== */

function getSportIcon(type) {

  return (
    SPORT_TYPES[type]?.icon ||
    "🏟️"
  );

}


/* =====================================================
   MARKER
   ===================================================== */

function createMarker(place) {

  const icon =
    L.divIcon({

      className: "",

      html: `

        <div class="sport-marker">

          <span>
            ${getSportIcon(place.type)}
          </span>

        </div>

      `,

      iconSize: [
        38,
        38
      ],

      iconAnchor: [
        19,
        38
      ],

      popupAnchor: [
        0,
        -38
      ]

    });


  const marker =
    L.marker(
      [
        place.lat,
        place.lng
      ],
      {
        icon
      }
    );


  const name =
    escapeHTML(
      place.name ||
      "Спортивное место"
    );


  const address =
    escapeHTML(
      place.address ||
      "Адрес не указан"
    );


  const typeLabel =
    SPORT_TYPES[
      place.type
    ]?.label ||
    "Спорт";


  const favoriteKey =
    "sportroom_place_" +
    place.id;


  const isFavorite =
    localStorage.getItem(
      favoriteKey
    ) === "true";


  marker.bindPopup(`

    <div class="place-popup">

      <div class="place-title">
        ${name}
      </div>

      <div class="place-type">
        ${getSportIcon(place.type)}
        ${typeLabel}
      </div>

      <div class="place-address">
        📍 ${address}
      </div>

      <div class="place-actions">

        <button
          class="place-btn route"
          onclick="
            openRoute(
              ${place.lat},
              ${place.lng}
            )
          "
        >
          🧭 Маршрут
        </button>

        <button
          class="place-btn favorite"
          onclick="
            toggleFavorite(
              '${favoriteKey}',
              this
            )
          "
        >
          ${isFavorite ? "♥ Сохранено" : "♡ Сохранить"}
        </button>

      </div>

    </div>

  `);


  return marker;

}


/* =====================================================
   RENDER
   ===================================================== */

function renderPlaces() {

  markerLayer.clearLayers();


  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    places.filter(
      place => {

        const matchesType =
          activeType === "all" ||
          place.type === activeType;


        const searchable = (

          place.name +
          " " +
          place.address +
          " " +
          place.type

        ).toLowerCase();


        const matchesSearch =
          !query ||
          searchable.includes(query);


        return (
          matchesType &&
          matchesSearch
        );

      }
    );


  filtered.forEach(
    place => {

      createMarker(place)
        .addTo(markerLayer);

    }
  );


  resultsCount.textContent =
    filtered.length;

}


/* =====================================================
   FAVORITE
   ===================================================== */

function toggleFavorite(
  key,
  button
) {

  const current =
    localStorage.getItem(key)
    === "true";


  localStorage.setItem(
    key,
    String(!current)
  );


  button.textContent =
    !current
      ? "♥ Сохранено"
      : "♡ Сохранить";

}


/* =====================================================
   ROUTE
   ===================================================== */

function openRoute(
  lat,
  lng
) {

  const url =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   OVERPASS QUERY
   ===================================================== */

async function loadSportsPlaces() {

  setLoading(true);


  const bounds =
    map.getBounds();


  const south =
    bounds.getSouth();


  const west =
    bounds.getWest();


  const north =
    bounds.getNorth();


  const east =
    bounds.getEast();


  const query = `

    [out:json][timeout:15];

    (

      node["sport"](${south},${west},${north},${east});

      way["sport"](${south},${west},${north},${east});

      relation["sport"](${south},${west},${north},${east});

      node["leisure"="sports_centre"](${south},${west},${north},${east});

      way["leisure"="sports_centre"](${south},${west},${north},${east});

      node["leisure"="fitness_centre"](${south},${west},${north},${east});

      way["leisure"="fitness_centre"](${south},${west},${north},${east});

      node["leisure"="pitch"](${south},${west},${north},${east});

      way["leisure"="pitch"](${south},${west},${north},${east});

      node["leisure"="swimming_pool"](${south},${west},${north},${east});

      way["leisure"="swimming_pool"](${south},${west},${north},${east});

    );

    out center tags;

  `;


  try {

    const response =
      await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body:
            "data=" +
            encodeURIComponent(query)
        }
      );


    if (!response.ok) {
      throw new Error(
        "Ошибка Overpass API"
      );
    }


    const data =
      await response.json();


    const newPlaces =
      data.elements
        .map(
          element => {

            const lat =
              element.lat ??
              element.center?.lat;


            const lng =
              element.lon ??
              element.center?.lon;


            if (
              lat == null ||
              lng == null
            ) {
              return null;
            }


            const tags =
              element.tags || {};


            const name =
              tags.name ||
              tags["name:en"] ||
              "Спортивное место";


            const address = [

              tags["addr:housenumber"],

              tags["addr:street"],

              tags["addr:suburb"]

            ]
              .filter(Boolean)
              .join(" ");


            return {

              id:
                element.type +
                "_" +
                element.id,

              lat,
              lng,

              name,

              address,

              type:
                detectSportType(tags)

            };

          }
        )
        .filter(Boolean);


    places =
      deduplicatePlaces(
        newPlaces
      );


    renderPlaces();


  } catch (error) {

    console.error(
      error
    );

    /*
      Если API временно недоступен,
      карта всё равно продолжает работать.
    */

  } finally {

    setLoading(false);

  }

}


/* =====================================================
   REMOVE DUPLICATES
   ===================================================== */

function deduplicatePlaces(
  list
) {

  const result = [];

  const seen =
    new Set();


  for (
    const place of list
  ) {

    const key =
      [
        place.name
          .toLowerCase()
          .trim(),

        place.lat
          .toFixed(4),

        place.lng
          .toFixed(4)

      ].join("_");


    if (
      seen.has(key)
    ) {
      continue;
    }


    seen.add(key);

    result.push(place);

  }


  return result;

}


/* =====================================================
   SEARCH
   ===================================================== */

searchInput.addEventListener(
  "input",
  function() {

    clearSearch.style.display =
      this.value
        ? "block"
        : "none";


    clearTimeout(
      searchTimer
    );


    searchTimer =
      setTimeout(
        renderPlaces,
        CONFIG.searchDelay
      );

  }
);


clearSearch.addEventListener(
  "click",
  function() {

    searchInput.value = "";

    this.style.display =
      "none";

    renderPlaces();

    searchInput.focus();

  }
);


/* =====================================================
   FILTERS
   ===================================================== */

document
  .querySelectorAll(".filter")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".filter")
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          this.classList.add(
            "active"
          );


          activeType =
            this.dataset.type;


          renderPlaces();

        }
      );

    }
  );


/* =====================================================
   LOCATION
   ===================================================== */

document
  .getElementById(
    "locateButton"
  )
  .addEventListener(
    "click",
    function() {

      if (
        !navigator.geolocation
      ) {

        alert(
          "Ваш браузер не поддерживает определение местоположения."
        );

        return;

      }


      this.textContent =
        "⏳";


      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          map.setView(
            [
              lat,
              lng
            ],
            15,
            {
              animate: true
            }
          );


          if (
            userMarker
          ) {

            map.removeLayer(
              userMarker
            );

          }


          const userIcon =
            L.divIcon({

              className: "",

              html:
                `<div class="user-marker"></div>`,

              iconSize: [
                20,
                20
              ],

              iconAnchor: [
                10,
                10
              ]

            });


          userMarker =
            L.marker(
              [
                lat,
                lng
              ],
              {
                icon:
                  userIcon
              }
            )
            .addTo(map);


          userMarker.bindPopup(
            "📍 Вы здесь"
          );


          this.textContent =
            "📍";


          loadSportsPlaces();

        },

        error => {

          console.error(
            error
          );


          this.textContent =
            "📍";


          alert(
            "Не удалось определить местоположение. Разрешите доступ к геолокации в браузере."
          );

        },

        {
          enableHighAccuracy: true,

          timeout: 10000,

          maximumAge: 60000

        }

      );

    }
  );


/* =====================================================
   ZOOM
   ===================================================== */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => map.zoomIn()
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => map.zoomOut()
  );


/* =====================================================
   MAP MOVE
   ===================================================== */

let moveTimer = null;


map.on(
  "moveend",
  function() {

    clearTimeout(
      moveTimer
    );


    moveTimer =
      setTimeout(
        loadSportsPlaces,
        350
      );

  }
);


/* =====================================================
   INITIAL LOAD
   ===================================================== */

loadSportsPlaces();


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function() {

    setTimeout(
      () => map.invalidateSize(),
      100
    );

  }
);

</script>
