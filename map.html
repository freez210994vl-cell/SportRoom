<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0f14"
  >

  <title>Карта — SportRoom</title>

  <!-- LEAFLET -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-light: #fff1f2;

      --dark: #0b0f14;
      --text: #17191c;
      --muted: #73777d;

      --border: #e5e7eb;

      --shadow:
        0 15px 45px rgba(0,0,0,.10);
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f6f8;

      color: var(--text);

      min-height: 100vh;
    }


    a {
      text-decoration: none;
    }


    button,
    input,
    select {
      font-family: inherit;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 68px;

      background: rgba(255,255,255,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);

      z-index: 2000;
    }


    .header-inner {
      width: min(
        1200px,
        calc(100% - 30px)
      );

      height: 100%;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .logo {
      color: #111;

      font-size: 24px;

      font-weight: 950;

      letter-spacing: -1px;
    }


    .logo span {
      color: var(--red);
    }


    .nav {
      display: flex;

      align-items: center;

      gap: 5px;
    }


    .nav a {
      color: #555;

      padding: 10px 13px;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 750;

      transition: .2s;
    }


    .nav a:hover,
    .nav a.active {
      color: var(--red);

      background: var(--red-light);
    }


    .header-buttons {
      display: flex;

      gap: 8px;
    }


    .button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 42px;

      padding: 0 15px;

      border-radius: 11px;

      font-size: 13px;

      font-weight: 850;

      border: 1px solid transparent;

      cursor: pointer;

      transition: .2s;
    }


    .button-dark {
      background: var(--dark);

      color: white;
    }


    .button-red {
      background: var(--red);

      color: white;
    }


    .button-red:hover {
      background: var(--red-dark);
    }


    /* =====================================================
       MAP PAGE
       ===================================================== */

    .map-page {
      padding-top: 68px;

      height: 100vh;

      display: flex;

      flex-direction: column;
    }


    /* =====================================================
       SEARCH PANEL
       ===================================================== */

    .map-toolbar {
      position: absolute;

      top: 85px;

      left: 20px;

      z-index: 1000;

      width: min(
        410px,
        calc(100% - 40px)
      );
    }


    .search-box {
      display: flex;

      align-items: center;

      gap: 8px;

      background: white;

      padding: 7px;

      border-radius: 17px;

      box-shadow: var(--shadow);

      border: 1px solid rgba(0,0,0,.06);
    }


    .search-icon {
      width: 40px;

      height: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 18px;
    }


    #searchInput {
      flex: 1;

      min-width: 0;

      border: 0;

      outline: none;

      font-size: 14px;

      font-weight: 600;

      background: transparent;
    }


    #searchButton {
      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 12px;

      background: var(--red);

      color: white;

      font-size: 18px;

      cursor: pointer;
    }


    #searchButton:hover {
      background: var(--red-dark);
    }


    /* =====================================================
       FILTERS
       ===================================================== */

    .filters {
      margin-top: 9px;

      background: rgba(255,255,255,.96);

      border-radius: 17px;

      padding: 11px;

      box-shadow: var(--shadow);

      border: 1px solid rgba(0,0,0,.06);
    }


    .filters-title {
      font-size: 11px;

      font-weight: 900;

      color: #777;

      text-transform: uppercase;

      letter-spacing: .8px;

      margin-bottom: 8px;
    }


    .filter-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;
    }


    .filter-button {
      border: 1px solid #e5e7eb;

      background: white;

      color: #555;

      border-radius: 10px;

      padding: 8px 10px;

      font-size: 11px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }


    .filter-button:hover {
      border-color: #fecaca;

      color: var(--red);
    }


    .filter-button.active {
      background: var(--red);

      border-color: var(--red);

      color: white;
    }


    /* =====================================================
       LOCATION BUTTON
       ===================================================== */

    .location-button {
      width: 100%;

      margin-top: 9px;

      min-height: 46px;

      border: 0;

      border-radius: 13px;

      background: var(--dark);

      color: white;

      font-size: 13px;

      font-weight: 850;

      cursor: pointer;

      box-shadow: var(--shadow);

      transition: .2s;
    }


    .location-button:hover {
      transform: translateY(-1px);

      background: #171d26;
    }


    /* =====================================================
       MAP
       ===================================================== */

    #map {
      width: 100%;

      height: 100%;

      flex: 1;

      z-index: 1;
    }


    /* =====================================================
       RESULT PANEL
       ===================================================== */

    .results-panel {
      position: absolute;

      top: 85px;

      right: 20px;

      z-index: 1000;

      width: 330px;

      max-height: calc(100vh - 110px);

      overflow: hidden;

      display: flex;

      flex-direction: column;

      background: rgba(255,255,255,.97);

      border-radius: 20px;

      box-shadow: var(--shadow);

      border: 1px solid rgba(0,0,0,.06);
    }


    .results-header {
      padding: 17px;

      border-bottom: 1px solid #eee;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }


    .results-title {
      font-size: 16px;

      font-weight: 950;
    }


    .results-count {
      background: var(--red-light);

      color: var(--red);

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 900;
    }


    #results {
      overflow-y: auto;

      padding: 9px;
    }


    /* =====================================================
       RESULT CARD
       ===================================================== */

    .result-card {
      padding: 13px;

      border-radius: 15px;

      cursor: pointer;

      transition: .2s;

      border: 1px solid transparent;
    }


    .result-card:hover {
      background: #f8fafc;

      border-color: #e5e7eb;
    }


    .result-top {
      display: flex;

      align-items: flex-start;

      gap: 10px;
    }


    .result-icon {
      width: 43px;

      height: 43px;

      flex-shrink: 0;

      border-radius: 12px;

      background: var(--red-light);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 21px;
    }


    .result-info {
      min-width: 0;
    }


    .result-name {
      font-size: 13px;

      font-weight: 900;

      line-height: 1.3;
    }


    .result-type {
      margin-top: 3px;

      color: var(--red);

      font-size: 10px;

      font-weight: 850;
    }


    .result-address {
      margin-top: 8px;

      color: #777;

      font-size: 11px;

      line-height: 1.45;
    }


    .result-distance {
      margin-top: 6px;

      color: #555;

      font-size: 10px;

      font-weight: 800;
    }


    .result-actions {
      display: flex;

      gap: 6px;

      margin-top: 10px;
    }


    .result-action {
      flex: 1;

      min-height: 32px;

      border: 1px solid #e5e7eb;

      background: white;

      border-radius: 9px;

      font-size: 10px;

      font-weight: 850;

      cursor: pointer;
    }


    .result-action.primary {
      background: var(--red);

      border-color: var(--red);

      color: white;
    }


    /* =====================================================
       EMPTY
       ===================================================== */

    .empty {
      padding: 35px 15px;

      text-align: center;

      color: #777;
    }


    .empty-icon {
      font-size: 35px;

      margin-bottom: 10px;
    }


    .empty h3 {
      color: #222;

      font-size: 15px;

      margin-bottom: 6px;
    }


    .empty p {
      font-size: 12px;

      line-height: 1.5;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      padding: 30px;

      text-align: center;

      color: #777;

      font-size: 12px;
    }


    .spinner {
      width: 28px;

      height: 28px;

      border: 3px solid #eee;

      border-top-color: var(--red);

      border-radius: 50%;

      margin: 0 auto 12px;

      animation:
        spin .8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       CUSTOM MARKER
       ===================================================== */

    .sport-marker {
      width: 38px;

      height: 38px;

      border-radius: 50%;

      background: var(--red);

      border: 3px solid white;

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 18px;
    }


    .user-marker {
      width: 20px;

      height: 20px;

      border-radius: 50%;

      background: #2563eb;

      border: 4px solid white;

      box-shadow:
        0 0 0 8px rgba(37,99,235,.18),
        0 4px 12px rgba(0,0,0,.25);
    }


    /* =====================================================
       POPUP
       ===================================================== */

    .popup-title {
      font-size: 15px;

      font-weight: 900;

      margin-bottom: 5px;
    }


    .popup-type {
      color: var(--red);

      font-size: 11px;

      font-weight: 800;

      margin-bottom: 7px;
    }


    .popup-address {
      color: #666;

      font-size: 11px;

      line-height: 1.4;

      margin-bottom: 9px;
    }


    .popup-route {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 7px 10px;

      background: var(--red);

      color: white;

      border-radius: 8px;

      font-size: 11px;

      font-weight: 850;
    }


    /* =====================================================
       MOBILE NAV
       ===================================================== */

    .mobile-nav {
      display: none;

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 68px;

      background: rgba(255,255,255,.97);

      border-top: 1px solid #e5e7eb;

      z-index: 3000;

      padding-bottom:
        env(safe-area-inset-bottom);
    }


    .mobile-nav a {
      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 3px;

      color: #777;

      font-size: 10px;

      font-weight: 800;
    }


    .mobile-nav a span {
      font-size: 19px;
    }


    .mobile-nav a.active {
      color: var(--red);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 850px) {

      .nav,
      .header-buttons {
        display: none;
      }


      .map-toolbar {
        top: 78px;

        left: 10px;

        width: calc(100% - 20px);
      }


      .results-panel {
        top: auto;

        bottom: 78px;

        left: 10px;

        right: 10px;

        width: auto;

        max-height: 240px;

        border-radius: 17px;
      }


      .results-header {
        padding: 12px 14px;
      }


      #results {
        display: grid;

        grid-template-columns:
          repeat(
            auto-fill,
            minmax(240px, 1fr)
          );
      }


      .result-card {
        background: #fff;

        border: 1px solid #eee;
      }


      .mobile-nav {
        display: flex;
      }


      .map-page {
        padding-bottom: 68px;
      }

    }


    @media (max-width: 520px) {

      .filters {
        padding: 8px;
      }


      .filter-button {
        padding: 7px 8px;

        font-size: 10px;
      }


      .results-panel {
        max-height: 220px;
      }


      #results {
        display: block;
      }


      .result-card {
        margin-bottom: 5px;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      Sport<span>Room</span>
    </a>


    <nav class="nav">

      <a href="index.html">

      </a>

      <a href="sports.html">

      </a>

      <a
        href="map.html"

      >

      </a>

      </a>

    </nav>


    <div class="header-buttons">

      <a

      >

      </a>

      <a
        href="register.html"
        class="button button-red"

      </a>

    </div>

</header>



<!-- =====================================================
     MAP PAGE
     ===================================================== -->

<main class="map-page">


  <!-- SEARCH + FILTERS -->

  <div class="map-toolbar">

    <div class="search-box">

      <div class="search-icon">
        🔎
      </div>

      <input
        id="searchInput"
        type="search"

      >

      <button
        id="searchButton"

      >

      </button>

      <div class="filters-title">

      </div>


      <div class="filter-buttons">

        <button
          class="filter-button active"
          data-filter="all"
        >
          🌍 Все
        </button>

        <button
          class="filter-button"

        </button>

        <button

        </button>

        <button
          class="filter-button"

        >

        </button>

        <button

        </button>

    <button

  </div>



  <!-- ===================================================
       RESULTS
       =================================================== -->

  <aside class="results-panel">

    <div class="results-header">

      <div class="results-title">
        Спортивные места
      </div>

      <div
        class="results-count"
        id="resultsCount"
      >
        0
      </div>

    </div>


    <div id="results">

      <div class="empty">

        <div class="empty-icon">
          🗺️
        </div>

        <h3>
          Найдём спорт рядом

          Нажми «Определить моё местоположение»

  </aside>



  <!-- ===================================================
       MAP
       =================================================== -->

  <div id="map"></div>


</main>



<!-- =====================================================
     MOBILE NAV
     ===================================================== -->

<nav class="mobile-nav">

  <a href="index.html">

    <span>🏠</span>

    Главная

  </a>


  <a href="sports.html">

    <span>⚽</span>

    Спорт

  </a>


  <a
    href="map.html"
    class="active"
  >

    <span>🗺️</span>

    Карта

  </a>


  <a href="profile.html">

    <span>👤</span>

    Профиль

  </a>

</nav>



<!-- =====================================================
     LEAFLET
     ===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<script>

/* =====================================================
   CONFIG
   ===================================================== */

const DEFAULT_LOCATION = [
  -36.8509,
  174.7645
];

const SEARCH_RADIUS = 8000;


/*
  Overpass API.
  Он используется для поиска объектов
  OpenStreetMap поблизости.
*/

const OVERPASS_URL =
  "https://overpass-api.de/api/interpreter";


/* =====================================================
   MAP
   ===================================================== */

const map =
  L.map("map", {
    zoomControl: true
  }).setView(
    DEFAULT_LOCATION,
    13
  );


L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }
).addTo(map);



/* =====================================================
   LAYERS
   ===================================================== */

const markersLayer =
  L.layerGroup().addTo(map);


let userMarker = null;

let userCircle = null;

let userLocation = null;

let allPlaces = [];

let currentFilter = "all";

let loadingPlaces = false;



/* =====================================================
   ICONS
   ===================================================== */

function getSportIcon(place) {

  const text = (
    (place.name || "") +
    " " +
    (place.sport || "") +
    " " +
    (place.leisure || "") +
    " " +
    (place.amenity || "")
  ).toLowerCase();


  if (
    text.includes("football") ||
    text.includes("soccer") ||
    text.includes("футбол")
  ) {
    return "⚽";
  }


  if (
    text.includes("basketball") ||
    text.includes("баскет")
  ) {
    return "🏀";
  }


  if (
    text.includes("tennis") ||
    text.includes("теннис")
  ) {
    return "🎾";
  }


  if (
    text.includes("swimming") ||
    text.includes("pool") ||
    text.includes("бассейн")
  ) {
    return "🏊";
  }


  if (
    text.includes("fitness") ||
    text.includes("gym") ||
    text.includes("fitness_centre") ||
    text.includes("фитнес")
  ) {
    return "🏋️";
  }


  if (
    text.includes("boxing") ||
    text.includes("martial") ||
    text.includes("karate") ||
    text.includes("judo") ||
    text.includes("mma") ||
    text.includes("boxing")
  ) {
    return "🥊";
  }


  if (
    text.includes("golf")
  ) {
    return "⛳";
  }


  if (
    text.includes("cycling") ||
    text.includes("bicycle")
  ) {
    return "🚴";
  }


  if (
    text.includes("volleyball")
  ) {
    return "🏐";
  }


  if (
    text.includes("ice") ||
    text.includes("hockey")
  ) {
    return "🏒";
  }


  if (
    text.includes("athletics") ||
    text.includes("running")
  ) {
    return "🏃";
  }


  return "🏟️";
}



/* =====================================================
   TYPE
   ===================================================== */

function getPlaceType(place) {

  const text = (
    (place.name || "") +
    " " +
    (place.sport || "") +
    " " +
    (place.leisure || "") +
    " " +
    (place.amenity || "")
  ).toLowerCase();


  if (
    text.includes("football") ||
    text.includes("soccer")
  ) {
    return "football";
  }


  if (
    text.includes("basketball")
  ) {
    return "basketball";
  }


  if (
    text.includes("tennis")
  ) {
    return "tennis";
  }


  if (
    text.includes("swimming") ||
    text.includes("pool")
  ) {
    return "pool";
  }


  if (
    text.includes("fitness") ||
    text.includes("gym")
  ) {
    return "gym";
  }


  if (
    text.includes("boxing") ||
    text.includes("martial") ||
    text.includes("karate") ||
    text.includes("judo") ||
    text.includes("mma")
  ) {
    return "combat";
  }


  return "other";
}



/* =====================================================
   TYPE NAME
   ===================================================== */

function getTypeName(type) {

  const names = {

    football: "Футбол",

    basketball: "Баскетбол",

    tennis: "Теннис",

    pool: "Бассейн",

    gym: "Фитнес",

    combat: "Единоборства",

    other: "Спортивный объект"

  };


  return (
    names[type] ||
    "Спортивный объект"
  );
}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   DISTANCE
   ===================================================== */

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI /
    180;

  const dLon =
    (lon2 - lon1) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      lat1 * Math.PI / 180
    ) *

    Math.cos(
      lat2 * Math.PI / 180
    ) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}



/* =====================================================
   GET COORDINATES
   ===================================================== */

function getCoordinates(element) {

  if (
    element.lat !== undefined &&
    element.lon !== undefined
  ) {

    return [
      Number(element.lat),
      Number(element.lon)
    ];

  }


  if (
    element.center &&
    element.center.lat !== undefined &&
    element.center.lon !== undefined
  ) {

    return [
      Number(element.center.lat),
      Number(element.center.lon)
    ];

  }


  return null;

}



/* =====================================================
   QUERY OVERPASS
   ===================================================== */

async function loadSportsPlaces() {

  if (loadingPlaces) {
    return;
  }


  loadingPlaces = true;


  const center =
    map.getCenter();


  const lat =
    center.lat;


  const lon =
    center.lng;


  /*
    Ищем спортивные объекты
    в радиусе SEARCH_RADIUS.
  */

  const query = `
    [out:json][timeout:25];

    (
      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        leisure=sports_centre
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        leisure=pitch
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        leisure=fitness_centre
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        leisure=swimming_pool
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        leisure=golf_course
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        sport
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        amenity=studio
      ];

      nwr(
        around:${SEARCH_RADIUS},
        ${lat},
        ${lon}
      )[
        amenity=dojo
      ];
    );

    out center tags;
  `;


  showLoading();


  try {

    const response =
      await fetch(
        OVERPASS_URL,
        {
          method: "POST",

          body: query
        }
      );


    if (!response.ok) {
      throw new Error(
        "Overpass error"
      );
    }


    const data =
      await response.json();


    const places =
      data.elements
        .map(
          element => {

            const coordinates =
              getCoordinates(
                element
              );


            if (!coordinates) {
              return null;
            }


            const tags =
              element.tags || {};


            return {

              id:
                element.type +
                "_" +
                element.id,

              lat:
                coordinates[0],

              lon:
                coordinates[1],

              name:
                tags.name ||
                "Спортивный объект",

              sport:
                tags.sport ||
                "",

              leisure:
                tags.leisure ||
                "",

              amenity:
                tags.amenity ||
                "",

              address:
                buildAddress(
                  tags
                ),

              type:
                getPlaceType({
                  name:
                    tags.name,

                  sport:
                    tags.sport,

                  leisure:
                    tags.leisure,

                  amenity:
                    tags.amenity
                })

            };

          }
        )
        .filter(Boolean);


    /*
      Убираем дубликаты.
    */

    const unique =
      new Map();


    places.forEach(
      place => {

        const key =
          place.name +
          "_" +
          place.lat.toFixed(5) +
          "_" +
          place.lon.toFixed(5);


        if (!unique.has(key)) {

          unique.set(
            key,
            place
          );

        }

      }
    );


    allPlaces =
      Array.from(
        unique.values()
      );


    renderPlaces();


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "results"
    ).innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Не удалось загрузить места
        </h3>

        <p>
          Попробуй немного приблизить
          или переместить карту и повторить.
        </p>

      </div>

    `;

  } finally {

    loadingPlaces = false;

  }

}



/* =====================================================
   ADDRESS
   ===================================================== */

function buildAddress(tags) {

  const parts = [];


  if (tags["addr:housenumber"]) {

    parts.push(
      tags["addr:housenumber"]
    );

  }


  if (tags["addr:street"]) {

    parts.push(
      tags["addr:street"]
    );

  }


  if (tags["addr:city"]) {

    parts.push(
      tags["addr:city"]
    );

  }


  return parts.join(", ");

}



/* =====================================================
   SHOW LOADING
   ===================================================== */

function showLoading() {

  document.getElementById(
    "results"
  ).innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Ищем спортивные места...

    </div>

  `;

}



/* =====================================================
   RENDER PLACES
   ===================================================== */

function renderPlaces() {

  markersLayer.clearLayers();


  let places =
    allPlaces.filter(
      place => {

        if (
          currentFilter === "all"
        ) {
          return true;
        }


        return (
          place.type ===
          currentFilter
        );

      }
    );


  /*
    Сортируем по расстоянию
    от пользователя.
  */

  if (userLocation) {

    places.sort(
      (a, b) => {

        const da =
          distanceKm(
            userLocation.lat,
            userLocation.lng,
            a.lat,
            a.lon
          );


        const db =
          distanceKm(
            userLocation.lat,
            userLocation.lng,
            b.lat,
            b.lon
          );


        return da - db;

      }
    );

  }


  document.getElementById(
    "resultsCount"
  ).textContent =
    places.length;


  if (!places.length) {

    document.getElementById(
      "results"
    ).innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🔎
        </div>

        <h3>
          Ничего не найдено
        </h3>

        <p>
          Попробуй другой фильтр
          или перемести карту.
        </p>

      </div>

    `;

    return;

  }


  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML =
    places
      .map(
        (place, index) => {

          const icon =
            getSportIcon(
              place
            );


          let distance = "";


          if (userLocation) {

            const km =
              distanceKm(
                userLocation.lat,
                userLocation.lng,
                place.lat,
                place.lon
              );


            distance =
              km < 1
                ? Math.round(km * 1000) + " м"
                : km.toFixed(1) + " км";

          }


          return `

            <div
              class="result-card"
              data-index="${index}"
              data-id="${escapeHtml(place.id)}"
            >

              <div class="result-top">

                <div class="result-icon">
                  ${icon}
                </div>

                <div class="result-info">

                  <div class="result-name">
                    ${escapeHtml(place.name)}
                  </div>

                  <div class="result-type">
                    ${getTypeName(place.type)}
                  </div>

                </div>

              </div>


              ${
                place.address
                  ? `
                    <div class="result-address">
                      📍 ${escapeHtml(place.address)}
                    </div>
                  `
                  : ""
              }


              ${
                distance
                  ? `
                    <div class="result-distance">
                      📏 ${distance} от вас
                    </div>
                  `
                  : ""
              }


              <div class="result-actions">

                <button
                  class="result-action"
                  type="button"
                  onclick="focusPlace(
                    ${place.lat},
                    ${place.lon}
                  )"
                >
                  🗺️ На карте
                </button>


                <button
                  class="result-action primary"
                  type="button"
                  onclick="openRoute(
                    ${place.lat},
                    ${place.lon}
                  )"
                >
                  🧭 Маршрут
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");


  /*
    Маркеры.
  */

  places.forEach(
    (place, index) => {

      const icon =
        L.divIcon({

          className:
            "custom-sport-icon",

          html: `
            <div class="sport-marker">
              ${getSportIcon(place)}
            </div>
          `,

          iconSize:
            [38, 38],

          iconAnchor:
            [19, 19],

          popupAnchor:
            [0, -20]

        });


      const marker =
        L.marker(
          [
            place.lat,
            place.lon
          ],
          {
            icon
          }
        );


      const routeUrl =
        createRouteUrl(
          place.lat,
          place.lon
        );


      marker.bindPopup(`

        <div class="popup-title">
          ${escapeHtml(place.name)}
        </div>

        <div class="popup-type">
          ${getTypeName(place.type)}
        </div>

        ${
          place.address
            ? `
              <div class="popup-address">
                ${escapeHtml(place.address)}
              </div>
            `
            : ""
        }

        <a
          class="popup-route"
          href="${routeUrl}"
          target="_blank"
          rel="noopener"
        >
          🧭 Построить маршрут
        </a>

      `);


      marker.on(
        "click",
        function() {

          highlightResult(
            place.id
          );

        }
      );


      marker.addTo(
        markersLayer
      );

    }
  );


  /*
    Клик по карточке.
  */

  document
    .querySelectorAll(
      ".result-card"
    )
    .forEach(
      card => {

        card.addEventListener(
          "click",
          function(event) {

            if (
              event.target.closest(
                "button"
              )
            ) {
              return;
            }


            const id =
              this.dataset.id;


            const place =
              places.find(
                item =>
                  item.id === id
              );


            if (!place) {
              return;
            }


            focusPlace(
              place.lat,
              place.lon
            );

          }
        );

      }
    );

}



/* =====================================================
   FOCUS PLACE
   ===================================================== */

function focusPlace(
  lat,
  lon
) {

  map.setView(
    [
      lat,
      lon
    ],
    17,
    {
      animate: true
    }
  );


  /*
    Найти маркер
    и открыть popup.
  */

  markersLayer.eachLayer(
    marker => {

      const position =
        marker.getLatLng();


      if (
        Math.abs(
          position.lat - lat
        ) < 0.000001 &&

        Math.abs(
          position.lng - lon
        ) < 0.000001
      ) {

        setTimeout(
          () => {
            marker.openPopup();
          },
          400
        );

      }

    }
  );

}



/* =====================================================
   HIGHLIGHT RESULT
   ===================================================== */

function highlightResult(
  id
) {

  const card =
    document.querySelector(
      `.result-card[data-id="${CSS.escape(id)}"]`
    );


  if (!card) {
    return;
  }


  card.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



/* =====================================================
   ROUTE
   ===================================================== */

function createRouteUrl(
  lat,
  lon
) {

  if (userLocation) {

    return (
      "https://www.google.com/maps/dir/?api=1" +
      "&origin=" +
      encodeURIComponent(
        userLocation.lat +
        "," +
        userLocation.lng
      ) +
      "&destination=" +
      encodeURIComponent(
        lat +
        "," +
        lon
      )
    );

  }


  return (
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      lat +
      "," +
      lon
    )
  );

}



function openRoute(
  lat,
  lon
) {

  window.open(
    createRouteUrl(
      lat,
      lon
    ),
    "_blank"
  );

}



/* =====================================================
   LOCATION
   ===================================================== */

function locateUser() {

  if (
    !navigator.geolocation
  ) {

    alert(
      "Ваш браузер не поддерживает определение местоположения."
    );

    return;

  }


  const button =
    document.getElementById(
      "locationButton"
    );


  button.textContent =
    "📍 Определяем местоположение...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;


      const lon =
        position.coords.longitude;


      const accuracy =
        position.coords.accuracy;


      userLocation = {

        lat,
        lng: lon

      };


      /*
        Удаляем старый marker.
      */

      if (userMarker) {

        map.removeLayer(
          userMarker
        );

      }


      if (userCircle) {

        map.removeLayer(
          userCircle
        );

      }


      /*
        Маркер пользователя.
      */

      const userIcon =
        L.divIcon({

          className:
            "user-location-icon",

          html:
            '<div class="user-marker"></div>',

          iconSize:
            [20, 20],

          iconAnchor:
            [10, 10]

        });


      userMarker =
        L.marker(
          [lat, lon],
          {
            icon:
              userIcon
          }
        )
        .addTo(map);


      userMarker.bindPopup(
        "<b>📍 Вы здесь</b>"
      );


      /*
        Круг точности.
      */

      userCircle =
        L.circle(
          [lat, lon],
          {
            radius:
              accuracy,

            color:
              "#2563eb",

            fillColor:
              "#2563eb",

            fillOpacity:
              .08,

            weight:
              1
          }
        )
        .addTo(map);


      map.setView(
        [lat, lon],
        14,
        {
          animate:
            true
        }
      );


      button.textContent =
        "📍 Моё местоположение";


      loadSportsPlaces();

    },


    function(error) {

      button.textContent =
        "📍 Определить моё местоположение";


      let message =
        "Не удалось определить местоположение.";


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        message =
          "Доступ к местоположению запрещён. Разреши доступ к геолокации в настройках браузера.";

      }


      if (
        error.code ===
        error.POSITION_UNAVAILABLE
      ) {

        message =
          "Местоположение сейчас недоступно.";

      }


      if (
        error.code ===
        error.TIMEOUT
      ) {

        message =
          "Истекло время ожидания определения местоположения.";

      }


      alert(
        message
      );

    },

    {
      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        60000

    }

  );

}



/* =====================================================
   SEARCH ADDRESS
   ===================================================== */

async function searchLocation() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if (!query) {
    return;
  }


  const button =
    document.getElementById(
      "searchButton"
    );


  button.textContent =
    "…";


  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {
      throw new Error(
        "Search error"
      );
    }


    const data =
      await response.json();


    if (!data.length) {

      alert(
        "Место не найдено."
      );

      return;

    }


    const result =
      data[0];


    const lat =
      Number(result.lat);


    const lon =
      Number(result.lon);


    map.setView(
      [
        lat,
        lon
      ],
      14,
      {
        animate:
          true
      }
    );


    /*
      После поиска города
      загружаем спортивные места.
    */

    loadSportsPlaces();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Ошибка поиска. Попробуй ещё раз."
    );

  } finally {

    button.textContent =
      "→";

  }

}



/* =====================================================
   FILTERS
   ===================================================== */

document
  .querySelectorAll(
    ".filter-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".filter-button"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          this.classList.add(
            "active"
          );


          currentFilter =
            this.dataset.filter;


          renderPlaces();

        }
      );

    }
  );



/* =====================================================
   SEARCH BUTTON
   ===================================================== */

document
  .getElementById(
    "searchButton"
  )
  .addEventListener(
    "click",
    searchLocation
  );



document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        searchLocation();

      }

    }
  );



/* =====================================================
   LOCATION BUTTON
   ===================================================== */

document
  .getElementById(
    "locationButton"
  )
  .addEventListener(
    "click",
    locateUser
  );



/* =====================================================
   MAP MOVED
   ===================================================== */

let moveTimer = null;


map.on(
  "moveend",
  function() {

    clearTimeout(
      moveTimer
    );


    moveTimer =
      setTimeout(
        () => {

          loadSportsPlaces();

        },
        800
      );

  }
);



/* =====================================================
   INITIAL LOAD
   ===================================================== */

loadSportsPlaces();



/* =====================================================
   TRY LOCATION AUTOMATICALLY
   ===================================================== */

if (
  navigator.geolocation
) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;


      const lon =
        position.coords.longitude;


      userLocation = {

        lat,
        lng: lon

      };


      const userIcon =
        L.divIcon({

          className:
            "user-location-icon",

          html:
            '<div class="user-marker"></div>',

          iconSize:
            [20, 20],

          iconAnchor:
            [10, 10]

        });


      userMarker =
        L.marker(
          [lat, lon],
          {
            icon:
              userIcon
          }
        )
        .addTo(map);


      userCircle =
        L.circle(
          [lat, lon],
          {
            radius:
              position.coords.accuracy,

            color:
              "#2563eb",

            fillColor:
              "#2563eb",

            fillOpacity:
              .08,

            weight:
              1
          }
        )
        .addTo(map);


      map.setView(
        [
          lat,
          lon
        ],
        14
      );


      loadSportsPlaces();

    },

    function() {

      /*
        Пользователь мог запретить
        геолокацию — тогда оставляем
        карту на Auckland.
      */

    },

    {
      enableHighAccuracy:
        true,

      timeout:
        8000,

      maximumAge:
        300000

    }

  );

}

</script>
