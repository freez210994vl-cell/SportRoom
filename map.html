<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Карта — SportRoom</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINH+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #0b0f14;
      color: #111827;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       APP
       ===================================================== */

    .app {
      position: relative;

      width: 100%;
      height: 100dvh;

      min-height: 100vh;

      overflow: hidden;

      background: #f4f6f8;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .topbar {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      padding:
        max(12px, env(safe-area-inset-top))
        14px
        10px;

      pointer-events: none;
    }

    .topbar-inner {
      width: min(1100px, 100%);
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      pointer-events: auto;
    }

    .logo {
      display: inline-flex;
      align-items: center;

      min-height: 46px;

      padding: 0 16px;

      border-radius: 15px;

      background: rgba(11, 15, 20, .94);

      color: white;

      font-size: 20px;
      font-weight: 900;

      box-shadow:
        0 8px 30px rgba(0,0,0,.18);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo span {
      color: #ef4444;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 46px;
      min-height: 46px;

      border: 0;
      border-radius: 15px;

      background: rgba(255,255,255,.95);

      color: #111827;

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 8px 30px rgba(0,0,0,.14);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }


    /* =====================================================
       SEARCH PANEL
       ===================================================== */

    .search-panel {
      position: absolute;

      top: 72px;
      left: 14px;
      right: 14px;

      z-index: 900;

      width: min(680px, calc(100% - 28px));

      margin: 0 auto;

      pointer-events: none;
    }

    .search-box {
      display: flex;
      align-items: center;

      min-height: 54px;

      padding: 5px;

      border-radius: 17px;

      background: rgba(255,255,255,.97);

      box-shadow:
        0 12px 40px rgba(0,0,0,.15);

      pointer-events: auto;
    }

    .search-icon {
      width: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6b7280;

      font-size: 19px;
    }

    .search-input {
      flex: 1;

      min-width: 0;

      height: 44px;

      border: 0;
      outline: 0;

      background: transparent;

      color: #111827;

      font-size: 15px;
      font-weight: 600;
    }

    .search-input::placeholder {
      color: #9ca3af;
      font-weight: 500;
    }

    .clear-search {
      width: 40px;
      height: 40px;

      display: none;

      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 12px;

      background: #f1f3f5;

      color: #555;

      cursor: pointer;
    }

    .clear-search.visible {
      display: flex;
    }


    /* =====================================================
       FILTERS
       ===================================================== */

    .filters {
      display: flex;

      gap: 8px;

      margin-top: 9px;

      overflow-x: auto;

      padding-bottom: 3px;

      scrollbar-width: none;

      pointer-events: auto;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;

      min-height: 39px;

      padding: 0 14px;

      border: 1px solid rgba(255,255,255,.85);

      border-radius: 12px;

      background: rgba(255,255,255,.94);

      color: #374151;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0,0,0,.08);

      white-space: nowrap;
    }

    .filter.active {
      border-color: #ef4444;

      background: #ef4444;

      color: white;
    }


    /* =====================================================
       MAP
       ===================================================== */

    #map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      background: #dfe5e8;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
    }


    /* =====================================================
       LOCATION BUTTON
       ===================================================== */

    .location-button {
      position: absolute;

      right: 15px;

      bottom:
        calc(24px + env(safe-area-inset-bottom));

      z-index: 800;

      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 17px;

      background: rgba(255,255,255,.97);

      color: #111827;

      font-size: 22px;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0,0,0,.18);

      transition: transform .18s ease;
    }

    .location-button:active {
      transform: scale(.94);
    }

    .location-button.loading {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(.92);
      }
    }


    /* =====================================================
       RESULTS PANEL
       ===================================================== */

    .results-panel {
      position: absolute;

      left: 14px;
      right: 14px;

      bottom:
        calc(14px + env(safe-area-inset-bottom));

      z-index: 700;

      width: min(620px, calc(100% - 28px));

      margin: 0 auto;

      pointer-events: none;
    }

    .results-card {
      max-height: 35dvh;

      overflow: hidden;

      border-radius: 20px;

      background: rgba(255,255,255,.97);

      box-shadow:
        0 15px 50px rgba(0,0,0,.18);

      pointer-events: auto;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 13px 16px 10px;

      border-bottom: 1px solid #edf0f2;
    }

    .results-title {
      font-size: 14px;
      font-weight: 900;
    }

    .results-count {
      color: #8a9199;

      font-size: 11px;
      font-weight: 700;
    }

    .results-list {
      max-height: calc(35dvh - 48px);

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;
    }


    /* =====================================================
       PLACE ITEM
       ===================================================== */

    .place {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px 15px;

      border-bottom: 1px solid #f0f1f3;

      cursor: pointer;

      transition: background .15s ease;
    }

    .place:last-child {
      border-bottom: 0;
    }

    .place:active {
      background: #f5f6f7;
    }

    .place-icon {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #fff0f0;

      font-size: 21px;
    }

    .place-info {
      min-width: 0;
      flex: 1;
    }

    .place-name {
      overflow: hidden;

      color: #17191c;

      font-size: 13px;
      font-weight: 850;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-type {
      margin-top: 3px;

      color: #858b93;

      font-size: 11px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-distance {
      flex: 0 0 auto;

      color: #ef4444;

      font-size: 10px;
      font-weight: 850;
    }


    /* =====================================================
       EMPTY
       ===================================================== */

    .empty {
      padding: 24px 18px;

      text-align: center;

      color: #777;

      font-size: 13px;
      line-height: 1.5;
    }


    /* =====================================================
       POPUP
       ===================================================== */

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }

    .leaflet-popup-content {
      margin: 14px 15px;

      min-width: 190px;
    }

    .popup-title {
      margin-bottom: 5px;

      font-size: 15px;
      font-weight: 900;
    }

    .popup-type {
      margin-bottom: 11px;

      color: #777;

      font-size: 12px;
    }

    .popup-route {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 38px;

      padding: 0 12px;

      border-radius: 10px;

      background: #ef4444;

      color: white;

      font-size: 12px;
      font-weight: 800;
    }


    /* =====================================================
       USER MARKER
       ===================================================== */

    .user-marker {
      width: 20px;
      height: 20px;

      border: 4px solid white;

      border-radius: 50%;

      background: #2f80ed;

      box-shadow:
        0 0 0 6px rgba(47,128,237,.2),
        0 4px 12px rgba(0,0,0,.2);
    }


    /* =====================================================
       CUSTOM MARKER
       ===================================================== */

    .sport-marker {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid white;

      border-radius: 14px;

      background: #ef4444;

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);

      font-size: 21px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .topbar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .logo {
        min-height: 42px;

        padding: 0 13px;

        border-radius: 13px;

        font-size: 18px;
      }

      .back-button {
        min-width: 42px;
        min-height: 42px;

        border-radius: 13px;
      }

      .search-panel {
        top: 62px;

        left: 10px;
        right: 10px;

        width: auto;
      }

      .search-box {
        min-height: 51px;

        border-radius: 15px;
      }

      .search-input {
        font-size: 14px;
      }

      .filters {
        margin-top: 7px;
      }

      .filter {
        min-height: 36px;

        padding: 0 12px;

        border-radius: 11px;

        font-size: 11px;
      }

      .location-button {
        right: 10px;

        bottom:
          calc(
            18px +
            env(safe-area-inset-bottom) +
            140px
          );

        width: 50px;
        height: 50px;

        border-radius: 16px;
      }

      .results-panel {
        left: 10px;
        right: 10px;

        width: auto;

        bottom:
          calc(10px + env(safe-area-inset-bottom));
      }

      .results-card {
        max-height: 29dvh;

        border-radius: 18px;
      }

      .results-list {
        max-height: calc(29dvh - 48px);
      }

      .place {
        padding: 10px 12px;
      }

      .place-icon {
        width: 40px;
        height: 40px;

        flex-basis: 40px;

        border-radius: 12px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-width: 380px) {

      .logo {
        font-size: 17px;
      }

      .back-button {
        min-width: 40px;
        min-height: 40px;
      }

      .search-panel {
        top: 59px;
      }

      .results-card {
        max-height: 27dvh;
      }

      .results-list {
        max-height: calc(27dvh - 48px);
      }

      .place-type {
        font-size: 10px;
      }

    }


    /* =====================================================
       LANDSCAPE MOBILE
       ===================================================== */

    @media (max-height: 500px) and (orientation: landscape) {

      .search-panel {
        top: 58px;
      }

      .results-card {
        max-height: 45dvh;
      }

      .results-list {
        max-height: calc(45dvh - 48px);
      }

      .location-button {
        bottom:
          calc(15px + env(safe-area-inset-bottom));
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- ===================================================
       HEADER
       =================================================== -->

  <header class="topbar">

    <div class="topbar-inner">

      <a
        href="index.html"
        class="logo"
      >
        Sport<span>Room</span>
      </a>

      <button
        class="back-button"
        type="button"
        onclick="goBack()"
        aria-label="Назад"
      >
        ←
      </button>

    </div>

  </header>


  <!-- ===================================================
       SEARCH
       =================================================== -->

  <section class="search-panel">

    <div class="search-box">

      <div class="search-icon">
        🔎
      </div>

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Найти спортзал, площадку, бассейн..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >

      <button
        id="clearSearch"
        class="clear-search"
        type="button"
        aria-label="Очистить"
      >
        ×
      </button>

    </div>


    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        Все
      </button>

      <button
        class="filter"
        data-filter="gym"
      >
        🏋️ Спортзалы
      </button>

      <button
        class="filter"
        data-filter="football"
      >
        ⚽ Футбол
      </button>

      <button
        class="filter"
        data-filter="basketball"
      >
        🏀 Баскетбол
      </button>

      <button
        class="filter"
        data-filter="tennis"
      >
        🎾 Теннис
      </button>

      <button
        class="filter"
        data-filter="pool"
      >
        🏊 Бассейны
      </button>

      <button
        class="filter"
        data-filter="other"
      >
        🏟️ Другое
      </button>

    </div>

  </section>


  <!-- ===================================================
       MAP
       =================================================== -->

  <div id="map"></div>


  <!-- ===================================================
       LOCATION
       =================================================== -->

  <button
    id="locationButton"
    class="location-button"
    type="button"
    aria-label="Моё местоположение"
  >
    🎯
  </button>


  <!-- ===================================================
       RESULTS
       =================================================== -->

  <section class="results-panel">

    <div class="results-card">

      <div class="results-header">

        <div class="results-title">
          Спортивные места
        </div>

        <div
          id="resultsCount"
          class="results-count"
        >
          Загрузка...
        </div>

      </div>

      <div
        id="resultsList"
        class="results-list"
      ></div>

    </div>

  </section>


</div>


<!-- =====================================================
     LEAFLET
     ===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>


<script>

/* =====================================================
   SPORTROOM MAP
   ===================================================== */


/* =====================================================
   DEFAULT LOCATION

   Auckland используется только как стартовая точка.
   После разрешения геолокации карта переместится
   к пользователю.
   ===================================================== */

const DEFAULT_LOCATION = [
  -36.8509,
  174.7645
];


/* =====================================================
   MAP
   ===================================================== */

const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  tap: true,
  touchZoom: true,
  dragging: true,
  scrollWheelZoom: true,
  doubleClickZoom: true,
  boxZoom: true
}).setView(
  DEFAULT_LOCATION,
  13
);


/* =====================================================
   MAP TILES
   ===================================================== */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }
).addTo(map);


/* =====================================================
   ZOOM CONTROL
   ===================================================== */

L.control.zoom({
  position: "bottomleft"
}).addTo(map);


/* =====================================================
   SPORT PLACES
   ===================================================== */

/*
  Пока здесь демонстрационные объекты.

  Следующим этапом можно подключить:
  OpenStreetMap / Overpass API / Supabase,
  чтобы SportRoom автоматически загружал
  реальные спортивные объекты вокруг пользователя.
*/

const places = [

  {
    id: 1,
    name: "SportRoom Arena",
    type: "gym",
    category: "Спортзал",
    icon: "🏋️",
    lat: -36.8509,
    lng: 174.7645
  },

  {
    id: 2,
    name: "Football Stadium",
    type: "football",
    category: "Футбольное поле",
    icon: "⚽",
    lat: -36.8520,
    lng: 174.7720
  },

  {
    id: 3,
    name: "Basketball Court",
    type: "basketball",
    category: "Баскетбольная площадка",
    icon: "🏀",
    lat: -36.8460,
    lng: 174.7580
  },

  {
    id: 4,
    name: "Tennis Club",
    type: "tennis",
    category: "Теннисный корт",
    icon: "🎾",
    lat: -36.8560,
    lng: 174.7690
  },

  {
    id: 5,
    name: "Sport Swimming Pool",
    type: "pool",
    category: "Бассейн",
    icon: "🏊",
    lat: -36.8430,
    lng: 174.7660
  },

  {
    id: 6,
    name: "City Sports Centre",
    type: "other",
    category: "Спортивный комплекс",
    icon: "🏟️",
    lat: -36.8580,
    lng: 174.7580
  },

  {
    id: 7,
    name: "Outdoor Fitness",
    type: "gym",
    category: "Уличная тренажёрная площадка",
    icon: "💪",
    lat: -36.8480,
    lng: 174.7790
  },

  {
    id: 8,
    name: "Community Football",
    type: "football",
    category: "Футбольная площадка",
    icon: "⚽",
    lat: -36.8610,
    lng: 174.7620
  }

];


/* =====================================================
   MARKERS
   ===================================================== */

const markerLayer =
  L.layerGroup().addTo(map);

const markerById = new Map();


/* =====================================================
   CUSTOM ICON
   ===================================================== */

function createSportIcon(icon) {

  return L.divIcon({

    className: "",

    html: `
      <div class="sport-marker">
        ${icon}
      </div>
    `,

    iconSize: [
      42,
      42
    ],

    iconAnchor: [
      21,
      21
    ],

    popupAnchor: [
      0,
      -23
    ]

  });

}


/* =====================================================
   ROUTE URL
   ===================================================== */

function routeUrl(place) {

  const destination =
    `${place.lat},${place.lng}`;

  return (
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(destination)
  );

}


/* =====================================================
   CREATE MARKERS
   ===================================================== */

function createMarkers() {

  places.forEach(place => {

    const marker =
      L.marker(
        [
          place.lat,
          place.lng
        ],
        {
          icon:
            createSportIcon(
              place.icon
            }
        }
      );

    marker.bindPopup(`

      <div class="popup-title">
        ${escapeHtml(place.name)}
      </div>

      <div class="popup-type">
        ${escapeHtml(place.category)}
      </div>

      <a
        class="popup-route"
        href="${routeUrl(place)}"
        target="_blank"
        rel="noopener"
      >
        🧭 Маршрут
      </a>

    `);

    markerLayer.addLayer(marker);

    markerById.set(
      place.id,
      marker
    );

  });

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   FILTER
   ===================================================== */

let activeFilter = "all";


document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".filter")
          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });

        button.classList.add(
          "active"
        );

        activeFilter =
          button.dataset.filter;

        renderPlaces();

      }
    );

  });


/* =====================================================
   SEARCH
   ===================================================== */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const clearSearch =
  document.getElementById(
    "clearSearch"
  );


searchInput.addEventListener(
  "input",
  renderPlaces
);


clearSearch.addEventListener(
  "click",
  () => {

    searchInput.value = "";

    renderPlaces();

    searchInput.focus();

  }
);


/* =====================================================
   GET FILTERED PLACES
   ===================================================== */

function getFilteredPlaces() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  return places.filter(
    place => {

      const filterMatch =
        activeFilter === "all" ||
        place.type === activeFilter;


      const text =
        (
          place.name +
          " " +
          place.category
        ).toLowerCase();


      const searchMatch =
        !query ||
        text.includes(query);


      return (
        filterMatch &&
        searchMatch
      );

    }
  );

}


/* =====================================================
   DISTANCE
   ===================================================== */

function distanceKm(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLng =
    (lng2 - lng1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      lat1 * Math.PI / 180
    ) *

    Math.cos(
      lat2 * Math.PI / 180
    ) *

    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =====================================================
   USER LOCATION
   ===================================================== */

let userLocation = null;

let userMarker = null;


/* =====================================================
   RENDER PLACES
   ===================================================== */

function renderPlaces() {

  const filtered =
    getFilteredPlaces();


  clearSearch.classList.toggle(
    "visible",
    searchInput.value.length > 0
  );


  document.getElementById(
    "resultsCount"
  ).textContent =
    filtered.length +
    " " +
    pluralPlaces(filtered.length);


  const list =
    document.getElementById(
      "resultsList"
    );


  if (!filtered.length) {

    list.innerHTML = `

      <div class="empty">

        🔎<br><br>

        Ничего не найдено.<br>

        Попробуй изменить поиск
        или фильтр.

      </div>

    `;

    return;

  }


  const sorted =
    [...filtered].sort(
      (a, b) => {

        if (!userLocation) {
          return 0;
        }

        return (
          distanceKm(
            userLocation.lat,
            userLocation.lng,
            a.lat,
            a.lng
          ) -

          distanceKm(
            userLocation.lat,
            userLocation.lng,
            b.lat,
            b.lng
          )
        );

      }
    );


  list.innerHTML =
    sorted
      .map(place => {

        let distance = "";

        if (userLocation) {

          const km =
            distanceKm(
              userLocation.lat,
              userLocation.lng,
              place.lat,
              place.lng
            );

          distance =
            km < 1
              ? Math.round(km * 1000) + " м"
              : km.toFixed(1) + " км";

        }


        return `

          <div
            class="place"
            data-id="${place.id}"
          >

            <div class="place-icon">
              ${place.icon}
            </div>

            <div class="place-info">

              <div class="place-name">
                ${escapeHtml(place.name)}
              </div>

              <div class="place-type">
                ${escapeHtml(place.category)}
              </div>

            </div>

            ${
              distance
                ? `
                  <div class="place-distance">
                    ${distance}
                  </div>
                `
                : ""
            }

          </div>

        `;

      })
      .join("");


  list
    .querySelectorAll(".place")
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          const id =
            Number(
              item.dataset.id
            );

          const place =
            places.find(
              p => p.id === id
            );

          if (!place) return;


          map.flyTo(
            [
              place.lat,
              place.lng
            ],
            16,
            {
              duration: .7
            }
          );


          const marker =
            markerById.get(
              place.id
            );

          if (marker) {

            setTimeout(
              () => {

                marker.openPopup();

              },
              500
            );

          }

        }
      );

    });

}


/* =====================================================
   PLURAL
   ===================================================== */

function pluralPlaces(number) {

  const mod10 =
    number % 10;

  const mod100 =
    number % 100;


  if (
    mod10 === 1 &&
    mod100 !== 11
  ) {
    return "место";
  }


  if (
    mod10 >= 2 &&
    mod10 <= 4 &&
    (
      mod100 < 10 ||
      mod100 >= 20
    )
  ) {
    return "места";
  }


  return "мест";

}


/* =====================================================
   LOCATION BUTTON
   ===================================================== */

const locationButton =
  document.getElementById(
    "locationButton"
  );


locationButton.addEventListener(
  "click",
  locateUser
);


/* =====================================================
   LOCATE USER
   ===================================================== */

function locateUser() {

  if (!navigator.geolocation) {

    alert(
      "Ваш браузер не поддерживает определение местоположения."
    );

    return;

  }


  locationButton.classList.add(
    "loading"
  );


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      userLocation = {
        lat,
        lng
      };


      if (userMarker) {

        map.removeLayer(
          userMarker
        );

      }


      const userIcon =
        L.divIcon({

          className: "",

          html: `
            <div class="user-marker"></div>
          `,

          iconSize: [
            20,
            20
          ],

          iconAnchor: [
            10,
            10
          ]

        });


      userMarker =
        L.marker(
          [lat, lng],
          {
            icon: userIcon,
            zIndexOffset: 1000
          }
        )
        .addTo(map);


      userMarker.bindPopup(
        "<b>📍 Вы здесь</b>"
      );


      map.flyTo(
        [lat, lng],
        15,
        {
          duration: .8
        }
      );


      renderPlaces();


      locationButton.classList.remove(
        "loading"
      );

    },

    error => {

      locationButton.classList.remove(
        "loading"
      );


      let message =
        "Не удалось определить местоположение.";


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        message =
          "Разрешите SportRoom доступ к геолокации в настройках браузера.";

      }


      alert(message);

    },

    {
      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 60000

    }

  );

}


/* =====================================================
   BACK
   ===================================================== */

function goBack() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

  } else {

    window.location.href =
      "index.html";

  }

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer;


window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        () => {

          map.invalidateSize();

        },
        180
      );

  }
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      () => {

        map.invalidateSize();

      },
      350
    );

  }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !document.hidden
    ) {

      setTimeout(
        () => {

          map.invalidateSize();

        },
        250
      );

    }

  }
);


/* =====================================================
   START
   ===================================================== */

createMarkers();

renderPlaces();


/*
  Пытаемся определить местоположение
  автоматически.

  Если WebView мессенджера запрещает
  геолокацию — карта всё равно работает.
*/

if (
  navigator.geolocation
) {

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      userLocation = {
        lat,
        lng
      };


      const userIcon =
        L.divIcon({

          className: "",

          html: `
            <div class="user-marker"></div>
          `,

          iconSize: [
            20,
            20
          ],

          iconAnchor: [
            10,
            10
          ]

        });


      userMarker =
        L.marker(
          [lat, lng],
          {
            icon: userIcon,
            zIndexOffset: 1000
          }
        )
        .addTo(map);


      userMarker.bindPopup(
        "<b>📍 Вы здесь</b>"
      );


      map.setView(
        [lat, lng],
        14
      );


      renderPlaces();

    },

    () => {

      /*
        Ничего не делаем.
        Остаёмся на карте по умолчанию.
      */

    },

    {
      enableHighAccuracy: false,

      timeout: 6000,

      maximumAge: 300000

    }

  );

}


/* =====================================================
   FINAL MAP FIX
   ===================================================== */

setTimeout(
  () => {

    map.invalidateSize();

  },
  500
);

</script>
