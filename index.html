            <span>Username</span>

            <input

            <input
              id="cabinetEmailInput"

              <option>Теннис</option>
              <option>Хоккей</option>
              <option>Волейбол</option>
              <option>Бокс</option>
              <option>ММА</option>
              <option>Плавание</option>
              <option>Формула-1</option>
              <option>Лёгкая атлетика</option>

            </select>
          </label>

        </div>


        <label class="about-label">
          <span>О себе</span>

          <textarea
            id="cabinetBioInput"

            placeholder="Расскажи немного о себе..."

          <small>
            До 300 символов

        </label>


        <div class="profile-actions">

          <button

          </button>

          <button
            class="logout-button"

        </div>
      </div>

      <div class="stat-card">

        <div>

        </div>
      </div>

    </div>

</section>

<script>

/* =========================
   АВАТАР
========================= */

function previewAvatar(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    toast("Выберите изображение");

    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    document.getElementById(
      "avatarPreview"
    ).src = e.target.result;

  };

  reader.readAsDataURL(file);

}


/* =========================
   ЗАГРУЗКА ДАННЫХ КАБИНЕТА
========================= */

async function loadCabinet() {

  const result =
    await supabaseClient.auth.getUser();

  const user =
    result.data.user;

  if (!user) return;


  const profileResult =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


  const profile =
    profileResult.data || {};


  const name =
    profile.full_name ||
    user.user_metadata?.full_name ||
    "Пользователь";


  const username =
    profile.username ||
    "username";


  document.getElementById(
    "cabinetName"
  ).textContent = name;


  document.getElementById(
    "cabinetUsername"
  ).textContent =
    username.startsWith("@")
      ? username
      : "@" + username;


  document.getElementById(
    "cabinetEmail"
  ).textContent =
    user.email || "";


  document.getElementById(
    "cabinetNameInput"
  ).value = name === "Пользователь"
    ? ""
    : name;


  document.getElementById(
    "cabinetUsernameInput"
  ).value =
    username === "username"
      ? ""
      : username;


  document.getElementById(
    "cabinetEmailInput"
  ).value =
    user.email || "";


  document.getElementById(
    "cabinetBioInput"
  ).value =
    profile.bio || "";


  const sport =
    profile.favorite_sport;


  if (sport) {

    document.getElementById(
      "cabinetSportInput"
    ).value = sport;

  }


  if (profile.avatar_url) {

    document.getElementById(
      "avatarPreview"
    ).src =
      profile.avatar_url;

  } else {

    document.getElementById(
      "avatarPreview"
    ).src =
      "https://ui-avatars.com/api/?name="
      + encodeURIComponent(name)
      + "&background=ef4444&color=fff&size=256";

  }

}


/* =========================
   СОХРАНЕНИЕ
========================= */

async function saveCabinetProfile() {

  const result =
    await supabaseClient.auth.getUser();

  const user =
    result.data.user;

  if (!user) {

    toast("Сначала войдите в аккаунт");

    return;

  }


  const name =
    document.getElementById(
      "cabinetNameInput"
    ).value.trim();


  const username =
    document.getElementById(
      "cabinetUsernameInput"
    ).value.trim();


  const sport =
    document.getElementById(
      "cabinetSportInput"
    ).value;


  const bio =
    document.getElementById(
      "cabinetBioInput"
    ).value.trim();


  const resultSave =
    await supabaseClient
      .from("profiles")
      .upsert({

        id: user.id,

        full_name:
          name || "Пользователь",

        username:
          username || null,

        favorite_sport:
          sport,

        bio:
          bio,

        updated_at:
          new Date().toISOString()

      });


  if (resultSave.error) {

    toast(
      resultSave.error.message
    );

    return;

  }


  await loadCabinet();

  toast(
    "Профиль успешно сохранён!"
  );

}


/* =========================
   ПОКАЗ КАБИНЕТА
========================= */

async function showCabinet() {

  const result =
    await supabaseClient.auth.getUser();

  if (!result.data.user) {

    toast(
      "Сначала войдите в аккаунт"
    );

    return;

  }


  document.getElementById(
    "profile"
  ).classList.add("show");


  document.getElementById(
    "profile"
  ).scrollIntoView({
    behavior: "smooth"
  });


  await loadCabinet();

}


/* =========================
   АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
========================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    if (session) {

      setTimeout(
        showCabinet,
        100
      );

    }

  }
);

</script>
