workflows:
  ios-workflow:
    name: SportRoom iOS

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Prepare Flutter project
        script: |
          rm -rf flutter_project
          mkdir flutter_project

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d flutter_project

      - name: Install dependencies
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build iOS
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

    artifacts:
      - flutter_project/**/build/ios/iphoneos/*.app
