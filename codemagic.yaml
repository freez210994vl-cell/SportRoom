workflows:
  ios-workflow:
    name: SportRoom iOS
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Unpack Flutter project
        script: |
          rm -rf flutter_project
          mkdir flutter_project
          unzip -q SportRoom_AppStore_Submission_Pack_v1.0.zip -d flutter_project

      - name: Get Flutter packages
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          echo "Flutter project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          sed -i '' 's/^flutter_test:/  flutter_test:/' pubspec.yaml
          flutter pub get

      - name: Build iOS
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter build ipa --release

    artifacts:
      - flutter_project/**/build/ios/ipa/*.ipa
