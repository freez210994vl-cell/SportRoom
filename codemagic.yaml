workflows:
  ios-workflow:
    name: SportRoom iOS
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Unpack Flutter project
        script: |
          rm -rf flutter_project
          mkdir -p flutter_project
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d flutter_project
      - name: Get Flutter packages
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi
          echo "Flutter project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
      - name: Build iOS
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          flutter create --platforms=ios .
          flutter build ipa --release
    artifacts:
      - flutter_project/**/build/ios/ipa/*.ipa
  web-workflow:
    name: SportRoom Web
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Unpack Flutter project
        script: |
          rm -rf flutter_project
          mkdir -p flutter_project
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d flutter_project
      - name: Get Flutter packages
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          flutter pub get
      - name: Build Web
        script: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          flutter build web --release
    artifacts:
      - flutter_project/**/build/web/**
