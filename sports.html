<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SportRoom — Виды спорта</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .sports-page {
      min-height: 100vh;
      padding: 60px 0 90px;
    }

    .sports-page-inner {
      width: min(1150px, calc(100% - 36px));
      margin: auto;
    }

    .sports-page-header {
      margin-bottom: 35px;
    }

    .sports-page-header h1 {
      margin: 0 0 10px;
      font-size: clamp(38px, 6vw, 58px);
      letter-spacing: -2px;
    }

    .sports-page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 17px;
    }

    .sports-tools {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 12px;
      margin-bottom: 25px;
    }

    .sports-search,
    .sports-filter {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;

      border: 1px solid #d1d5db;
      border-radius: 12px;

      background: white;
      color: #111827;

      font-size: 15px;
      outline: none;
    }

    .sports-search:focus,
    .sports-filter:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px #ef444422;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .category-button {
      padding: 10px 15px;
      border-radius: 10px;

      background: white;
      border: 1px solid #e5e7eb;

      color: #374151;

      font-size: 13px;
      font-weight: 800;
    }

    .category-button:hover {
      border-color: #fecaca;
    }

    .category-button.active {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .sports-result {
      margin-bottom: 18px;
      color: #6b7280;
      font-size: 14px;
    }

    .sports-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .sport-item {
      min-height: 185px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;

      border: 1px solid #e5e7eb;
      border-radius: 18px;

      background: white;

      box-shadow: 0 5px 20px rgba(0,0,0,.04);

      text-align: center;

      transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;
    }

    .sport-item:hover {
      transform: translateY(-5px);

      border-color: #fecaca;

      box-shadow:
        0 15px 35px rgba(0,0,0,.08);
    }

    .sport-item-icon {
      width: 70px;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border-radius: 18px;

      background: #fff1f2;

      font-size: 38px;
    }

    .sport-item h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .sport-item p {
      margin: 0;
      color: #9ca3af;
      font-size: 12px;
    }

    .empty-sports {
      grid-column: 1 / -1;

      padding: 60px 20px;

      border-radius: 18px;

      background: white;

      text-align: center;

      color: #6b7280;
    }

    .empty-sports-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    @media (max-width: 1000px) {
      .sports-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 800px) {
      .sports-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .sports-page {
        padding: 40px 0 60px;
      }

      .sports-tools {
        grid-template-columns: 1fr;
      }

      .sports-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .sport-item {
        min-height: 160px;
        padding: 15px;
      }

      .sport-item-icon {
        width: 60px;
        height: 60px;
        font-size: 32px;
      }
    }
  </style>
</head>

<body>


<!-- HEADER -->

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      Sport<span>Room</span>
    </a>

    <nav class="nav">

      <a href="index.html">
        Главная
      </a>

      <a href="sports.html" class="active">
        Спорт
      </a>

      <a href="profile.html">
        Профиль
      </a>

    </nav>

    <div class="header-buttons">

      <a
        href="login.html"
        class="button button-dark"
      >
        Войти
      </a>

      <a
        href="register.html"
        class="button button-red"
      >
        Регистрация
      </a>

    </div>

  </div>

</header>


<!-- SPORTS -->

<main class="sports-page">

  <div class="sports-page-inner">


    <div class="sports-page-header">

      <div class="section-label">
        SPORTROOM
      </div>

      <h1>
        Все виды спорта
      </h1>

      <p>
        Найди свой любимый спорт среди
        основных спортивных дисциплин.
      </p>

    </div>


    <!-- SEARCH -->

    <div class="sports-tools">

      <input
        id="sportsSearch"
        class="sports-search"
        type="search"
        placeholder="🔎 Поиск вида спорта..."
        autocomplete="off"
      >

      <select
        id="sportsFilter"
        class="sports-filter"
      >

        <option value="all">
          Все категории
        </option>

        <option value="team">
          Командные
        </option>

        <option value="racket">
          Ракеточные
        </option>

        <option value="combat">
          Единоборства
        </option>

        <option value="winter">
          Зимние
        </option>

        <option value="water">
          Водные
        </option>

        <option value="motor">
          Авто и мотоспорт
        </option>

        <option value="athletics">
          Атлетика
        </option>

        <option value="other">
          Другие
        </option>

      </select>

    </div>


    <!-- CATEGORY BUTTONS -->

    <div class="category-buttons">

      <button
        class="category-button active"
        data-category="all"
      >
        Все
      </button>

      <button
        class="category-button"
        data-category="team"
      >
        Командные
      </button>

      <button
        class="category-button"
        data-category="racket"
      >
        Ракеточные
      </button>

      <button
        class="category-button"
        data-category="combat"
      >
        Единоборства
      </button>

      <button
        class="category-button"
        data-category="winter"
      >
        Зимние
      </button>

      <button
        class="category-button"
        data-category="water"
      >
        Водные
      </button>

      <button
        class="category-button"
        data-category="motor"
      >
        Авто и мото
      </button>

      <button
        class="category-button"
        data-category="athletics"
      >
        Атлетика
      </button>

      <button
        class="category-button"
        data-category="other"
      >
        Другие
      </button>

    </div>


    <div
      id="sportsResult"
      class="sports-result"
    ></div>


    <div
      id="sportsGrid"
      class="sports-grid"
    ></div>


  </div>

</main>


<!-- FOOTER -->

<footer class="footer">

  <div class="footer-inner">

    <div class="logo">
      Sport<span>Room</span>
    </div>

    <p>
      © 2026 SportRoom. Спорт в одном месте.
    </p>

  </div>

</footer>


<script>

const sports = [

  ["⚽","Футбол","team"],
  ["🏀","Баскетбол","team"],
  ["🏈","Американский футбол","team"],
  ["⚾","Бейсбол","team"],
  ["🏒","Хоккей","team"],
  ["🏉","Регби","team"],
  ["🏐","Волейбол","team"],
  ["🤾","Гандбол","team"],
  ["🏑","Хоккей на траве","team"],
  ["🥍","Лакросс","team"],
  ["🥅","Флорбол","team"],

  ["🎾","Теннис","racket"],
  ["🏸","Бадминтон","racket"],
  ["🏓","Настольный теннис","racket"],

  ["🥊","Бокс","combat"],
  ["🥋","Дзюдо","combat"],
  ["🥋","Каратэ","combat"],
  ["🥊","ММА","combat"],
  ["🤼","Борьба","combat"],
  ["🤺","Фехтование","combat"],
  ["🥋","Тхэквондо","combat"],
  ["🥋","Самбо","combat"],

  ["⛷️","Горные лыжи","winter"],
  ["🏂","Сноуборд","winter"],
  ["⛸️","Фигурное катание","winter"],
  ["🥌","Кёрлинг","winter"],
  ["🛷","Бобслей","winter"],
  ["🎿","Лыжные гонки","winter"],
  ["🛷","Скелетон","winter"],

  ["🏊","Плавание","water"],
  ["🤽","Водное поло","water"],
  ["🤿","Прыжки в воду","water"],
  ["🚣","Гребля","water"],
  ["🛶","Каноэ","water"],
  ["🏄","Сёрфинг","water"],
  ["🏄","Вейкбординг","water"],
  ["🤽","Синхронное плавание","water"],

  ["🏎️","Формула-1","motor"],
  ["🏍️","Мотогонки","motor"],
  ["🚗","Ралли","motor"],
  ["🏎️","Картинг","motor"],
  ["🏁","NASCAR","motor"],

  ["🏃","Лёгкая атлетика","athletics"],
  ["🤸","Спортивная гимнастика","athletics"],
  ["🏋️","Тяжёлая атлетика","athletics"],
  ["🚴","Велоспорт","athletics"],
  ["🧗","Скалолазание","athletics"],
  ["🏃","Марафон","athletics"],
  ["🚵","Маунтинбайк","athletics"],

  ["⛳","Гольф","other"],
  ["🏇","Конный спорт","other"],
  ["🎯","Дартс","other"],
  ["🏹","Стрельба из лука","other"],
  ["🎱","Бильярд","other"],
  ["♟️","Шахматы","other"],
  ["🎮","Киберспорт","other"],
  ["🪂","Парашютный спорт","other"],
  ["🥏","Фрисби","other"],
  ["🎳","Боулинг","other"],
  ["🏹","Спортивная стрельба","other"]

];


const categoryNames = {

  all: "Все категории",
  team: "Командный спорт",
  racket: "Ракеточный спорт",
  combat: "Единоборства",
  winter: "Зимний спорт",
  water: "Водный спорт",
  motor: "Авто и мотоспорт",
  athletics: "Атлетика",
  other: "Другие дисциплины"

};


let currentCategory = "all";


const searchInput =
  document.getElementById(
    "sportsSearch"
  );

const filter =
  document.getElementById(
    "sportsFilter"
  );

const grid =
  document.getElementById(
    "sportsGrid"
  );

const result =
  document.getElementById(
    "sportsResult"
  );


function renderSports() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const selectedCategory =
    currentCategory !== "all"
      ? currentCategory
      : filter.value;


  const filtered =
    sports.filter(sport => {

      const name =
        sport[1].toLowerCase();

      const matchesSearch =
        name.includes(search);

      const matchesCategory =
        selectedCategory === "all" ||
        sport[2] === selectedCategory;

      return (
        matchesSearch &&
        matchesCategory
      );

    });


  result.textContent =
    `Найдено видов спорта: ${filtered.length}`;


  if (!filtered.length) {

    grid.innerHTML = `

      <div class="empty-sports">

        <div class="empty-sports-icon">
          🔎
        </div>

        <h3>
          Ничего не найдено
        </h3>

        <p>
          Попробуй изменить поисковый запрос
          или выбрать другую категорию.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered.map(sport => `

      <a
        class="sport-item"
        href="sport.html?sport=${encodeURIComponent(sport[1])}"
      >

        <div class="sport-item-icon">
          ${sport[0]}
        </div>

        <h3>
          ${sport[1]}
        </h3>

        <p>
          ${categoryNames[sport[2]]}
        </p>

      </a>

    `).join("");

}


searchInput.addEventListener(
  "input",
  renderSports
);


filter.addEventListener(
  "change",
  function() {

    currentCategory = "all";

    document
      .querySelectorAll(".category-button")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.category === "all"
        );

      });

    renderSports();

  }
);


document
  .querySelectorAll(".category-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        currentCategory =
          this.dataset.category;


        filter.value =
          "all";


        document
          .querySelectorAll(".category-button")
          .forEach(item => {

            item.classList.remove(
              "active"
            );

          });


        this.classList.add(
          "active"
        );


        renderSports();

      }
    );

  });


/* Открытие конкретного спорта
   из ссылки index.html?sport=... */

const params =
  new URLSearchParams(
    window.location.search
  );

const sportFromUrl =
  params.get("sport");


if (sportFromUrl) {

  searchInput.value =
    sportFromUrl;

}


renderSports();

</script>

</body>
</html>
