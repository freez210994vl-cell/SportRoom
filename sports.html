<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="SportRoom — каталог видов спорта."
  >

  <meta name="theme-color" content="#0b0f14">

  <title>SportRoom — Спорт</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =====================================================
       SPORTS PAGE
       ===================================================== */

    .sports-page {
      min-height: 100vh;
      padding: 45px 0 90px;

      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(239,68,68,.08),
          transparent 28%
        ),
        #f8fafc;
    }

    .sports-page-inner {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .sports-hero {
      position: relative;
      overflow: hidden;

      padding: 55px 50px;

      margin-bottom: 25px;

      border-radius: 30px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(239,68,68,.38),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #0b1120,
          #1f2937
        );

      color: white;

      box-shadow:
        0 25px 60px rgba(15,23,42,.15);
    }

    .sports-hero::before {
      content: "";

      position: absolute;

      width: 330px;
      height: 330px;

      right: -120px;
      top: -160px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 50%;
    }

    .sports-hero::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      right: 80px;
      bottom: -150px;

      border:
        1px solid
        rgba(255,255,255,.06);

      border-radius: 50%;
    }

    .sports-hero-content {
      position: relative;
      z-index: 2;

      max-width: 720px;
    }

    .sports-hero-label {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 18px;

      padding: 8px 13px;

      border:
        1px solid
        rgba(239,68,68,.25);

      border-radius: 30px;

      background:
        rgba(239,68,68,.15);

      color: #fca5a5;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 1.5px;
    }

    .sports-hero h1 {
      margin: 0 0 15px;

      font-size:
        clamp(42px, 7vw, 70px);

      line-height: 1;

      letter-spacing: -3px;
    }

    .sports-hero h1 span {
      color: #ef4444;
    }

    .sports-hero p {
      max-width: 650px;

      margin: 0;

      color: #cbd5e1;

      font-size: 17px;

      line-height: 1.7;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    .sports-search-box {
      position: relative;

      margin-bottom: 18px;
    }

    .sports-search {
      width: 100%;
      height: 62px;

      box-sizing: border-box;

      padding:
        0 55px 0 58px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 17px;

      outline: none;

      background: white;

      color: #111827;

      font-size: 16px;

      box-shadow:
        0 8px 30px
        rgba(15,23,42,.05);

      transition: .2s;
    }

    .sports-search:focus {
      border-color: #fca5a5;

      box-shadow:
        0 0 0 4px
        rgba(239,68,68,.08);
    }

    .search-icon {
      position: absolute;

      left: 21px;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 21px;

      pointer-events: none;
    }

    .clear-search {
      position: absolute;

      right: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      width: 34px;
      height: 34px;

      display: none;

      align-items: center;
      justify-content: center;

      border: 0;

      border-radius: 50%;

      background: #f1f5f9;

      color: #64748b;

      cursor: pointer;

      font-size: 17px;
    }

    .clear-search.show {
      display: flex;
    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    .sports-controls {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .category-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .category-button {
      border:
        1px solid
        #e2e8f0;

      background: white;

      color: #475569;

      padding:
        10px 15px;

      border-radius: 12px;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }

    .category-button:hover {
      border-color: #fecaca;

      color: #dc2626;

      transform:
        translateY(-1px);
    }

    .category-button.active {
      background: #ef4444;

      border-color: #ef4444;

      color: white;

      box-shadow:
        0 8px 20px
        rgba(239,68,68,.20);
    }


    /* =====================================================
       RESULT
       ===================================================== */

    .sports-result {
      margin-bottom: 15px;

      color: #64748b;

      font-size: 14px;
      font-weight: 700;
    }


    /* =====================================================
       GRID
       ===================================================== */

    .sports-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;
    }


    /* =====================================================
       SPORT CARD
       ===================================================== */

    .sport-item {
      position: relative;

      min-height: 210px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;

      box-sizing: border-box;

      padding: 25px;

      overflow: hidden;

      border:
        1px solid
        #e5e7eb;

      border-radius: 22px;

      background: white;

      color: #111827;

      text-decoration: none;

      box-shadow:
        0 6px 25px
        rgba(15,23,42,.04);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }

    .sport-item::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      right: -40px;
      bottom: -40px;

      border-radius: 50%;

      background: #fff1f2;

      transition: .25s;
    }

    .sport-item:hover {
      transform:
        translateY(-7px);

      border-color: #fecaca;

      box-shadow:
        0 18px 40px
        rgba(15,23,42,.10);
    }

    .sport-item:hover::after {
      transform:
        scale(1.25);
    }


    /* =====================================================
       ICON
       ===================================================== */

    .sport-item-icon {
      position: relative;
      z-index: 2;

      width: 70px;
      height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #fff1f2,
          #ffe4e6
        );

      font-size: 38px;

      transition: .25s;
    }

    .sport-item:hover
    .sport-item-icon {
      transform:
        scale(1.08)
        rotate(-3deg);
    }


    /* =====================================================
       TEXT
       ===================================================== */

    .sport-item h3 {
      position: relative;
      z-index: 2;

      margin: 0 0 7px;

      font-size: 18px;

      letter-spacing: -.3px;
    }

    .sport-item p {
      position: relative;
      z-index: 2;

      margin: 0;

      color: #94a3b8;

      font-size: 12px;

      font-weight: 700;
    }


    /* =====================================================
       ARROW
       ===================================================== */

    .sport-arrow {
      position: absolute;
      z-index: 3;

      right: 20px;
      top: 20px;

      width: 34px;
      height: 34px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f8fafc;

      color: #64748b;

      font-size: 16px;

      transition: .2s;
    }

    .sport-item:hover
    .sport-arrow {
      background: #ef4444;

      color: white;

      transform:
        translateX(3px);
    }


    /* =====================================================
       EMPTY
       ===================================================== */

    .empty-sports {
      grid-column: 1 / -1;

      padding: 70px 25px;

      border:
        1px solid
        #e5e7eb;

      border-radius: 22px;

      background: white;

      text-align: center;
    }

    .empty-sports-icon {
      margin-bottom: 15px;

      font-size: 52px;
    }

    .empty-sports h3 {
      margin: 0 0 8px;

      font-size: 22px;
    }

    .empty-sports p {
      margin: 0;

      color: #64748b;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 1000px) {

      .sports-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }


    @media (max-width: 750px) {

      .sports-page {
        padding: 30px 0 70px;
      }

      .sports-hero {
        padding: 38px 28px;

        border-radius: 24px;
      }

      .sports-hero h1 {
        font-size: 48px;

        letter-spacing: -2px;
      }

      .sports-hero p {
        font-size: 15px;
      }

      .sports-controls {
        align-items: flex-start;

        flex-direction: column;
      }

      .sports-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 11px;
      }

      .sport-item {
        min-height: 180px;

        padding: 18px;
      }

      .sport-item-icon {
        width: 58px;
        height: 58px;

        font-size: 31px;

        margin-bottom: 14px;
      }

      .sport-item h3 {
        font-size: 15px;
      }

    }


    @media (max-width: 430px) {

      .sports-page-inner {
        width:
          calc(100% - 24px);
      }

      .sports-hero {
        padding: 32px 22px;
      }

      .sports-hero h1 {
        font-size: 40px;
      }

      .sports-hero p {
        font-size: 15px;
      }

      .sports-search {
        height: 56px;

        padding-left: 50px;
      }

      .category-buttons {
        gap: 6px;
      }

      .category-button {
        padding:
          9px 12px;

        font-size: 12px;
      }

      .sports-grid {
        gap: 9px;
      }

      .sport-item {
        min-height: 165px;

        padding: 15px;

        border-radius: 18px;
      }

      .sport-item-icon {
        width: 52px;
        height: 52px;

        border-radius: 16px;

        font-size: 28px;
      }

      .sport-item h3 {
        font-size: 14px;
      }

      .sport-item p {
        font-size: 10px;
      }

      .sport-arrow {
        right: 12px;
        top: 12px;

        width: 29px;
        height: 29px;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >
      Sport<span>Room</span>
    </a>


    <nav class="nav">

      <a href="index.html">
        Главная
      </a>

      <a
        href="sports.html"
        class="active"
      >
        Спорт
      </a>

      <!-- НОВАЯ ВКЛАДКА КАРТА -->

      <a href="map.html">
        Карта
      </a>

      <a href="profile.html">
        Профиль
      </a>

    </nav>


    <div class="header-buttons">

      <a
        href="login.html"
        class="button button-dark"
      >
        Войти
      </a>

      <a
        href="register.html"
        class="button button-red"
      >
        Регистрация
      </a>

    </div>

  </div>

</header>


<!-- =====================================================
     SPORTS
     ===================================================== -->

<main class="sports-page">

  <div class="sports-page-inner">


    <!-- HERO -->

    <section class="sports-hero">

      <div class="sports-hero-content">

        <div class="sports-hero-label">
          🏆 SPORTROOM
        </div>

        <h1>
          Найди свой
          <span>спорт</span>
        </h1>

        <p>
          Открой для себя спортивные
          дисциплины, найди любимый спорт
          и следи за своим спортивным путём.
        </p>

      </div>

    </section>


    <!-- SEARCH -->

    <div class="sports-search-box">

      <div class="search-icon">
        🔎
      </div>

      <input
        id="sportsSearch"
        class="sports-search"
        type="search"
        placeholder="Поиск вида спорта..."
        autocomplete="off"
      >

      <button
        id="clearSearch"
        class="clear-search"
        type="button"
        aria-label="Очистить поиск"
      >
        ×
      </button>

    </div>


    <!-- CATEGORIES -->

    <div class="sports-controls">

      <div class="category-buttons">

        <button
          class="category-button active"
          data-category="all"
          type="button"
        >
          Все
        </button>

        <button
          class="category-button"
          data-category="team"
          type="button"
        >
          Командные
        </button>

        <button
          class="category-button"
          data-category="racket"
          type="button"
        >
          Ракеточные
        </button>

        <button
          class="category-button"
          data-category="combat"
          type="button"
        >
          Единоборства
        </button>

        <button
          class="category-button"
          data-category="winter"
          type="button"
        >
          Зимние
        </button>

        <button
          class="category-button"
          data-category="water"
          type="button"
        >
          Водные
        </button>

        <button
          class="category-button"
          data-category="motor"
          type="button"
        >
          Авто и мото
        </button>

        <button
          class="category-button"
          data-category="athletics"
          type="button"
        >
          Атлетика
        </button>

        <button
          class="category-button"
          data-category="other"
          type="button"
        >
          Другие
        </button>

      </div>

    </div>


    <!-- RESULT -->

    <div
      id="sportsResult"
      class="sports-result"
    ></div>


    <!-- GRID -->

    <div
      id="sportsGrid"
      class="sports-grid"
    ></div>


  </div>

</main>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="footer">

  <div class="footer-inner">

    <div class="logo">
      Sport<span>Room</span>
    </div>

    <p>
      © 2026 SportRoom. Спорт в одном месте.
    </p>

  </div>

</footer>


<!-- =====================================================
     MOBILE NAVIGATION
     ===================================================== -->

<nav class="mobile-nav">

  <a href="index.html">

    <span>🏠</span>

    Главная

  </a>


  <a
    href="sports.html"
    class="active"
  >

    <span>⚽</span>

    Спорт

  </a>


  <a href="map.html">

    <span>📍</span>

    Карта

  </a>


  <a href="profile.html">

    <span>👤</span>

    Профиль

  </a>

</nav>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


/* =====================================================
   SPORTS DATABASE
   ===================================================== */

const sports = [

  ["⚽", "Футбол", "team"],
  ["🏀", "Баскетбол", "team"],
  ["🏈", "Американский футбол", "team"],
  ["⚾", "Бейсбол", "team"],
  ["🏒", "Хоккей", "team"],
  ["🏉", "Регби", "team"],
  ["🏐", "Волейбол", "team"],
  ["🤾", "Гандбол", "team"],
  ["🏑", "Хоккей на траве", "team"],
  ["🥍", "Лакросс", "team"],
  ["🥅", "Флорбол", "team"],

  ["🎾", "Теннис", "racket"],
  ["🏸", "Бадминтон", "racket"],
  ["🏓", "Настольный теннис", "racket"],

  ["🥊", "Бокс", "combat"],
  ["🥋", "Дзюдо", "combat"],
  ["🥋", "Каратэ", "combat"],
  ["🥊", "ММА", "combat"],
  ["🤼", "Борьба", "combat"],
  ["🤺", "Фехтование", "combat"],
  ["🥋", "Тхэквондо", "combat"],
  ["🥋", "Самбо", "combat"],

  ["⛷️", "Горные лыжи", "winter"],
  ["🏂", "Сноуборд", "winter"],
  ["⛸️", "Фигурное катание", "winter"],
  ["🥌", "Кёрлинг", "winter"],
  ["🛷", "Бобслей", "winter"],
  ["🎿", "Лыжные гонки", "winter"],
  ["🛷", "Скелетон", "winter"],

  ["🏊", "Плавание", "water"],
  ["🤽", "Водное поло", "water"],
  ["🤿", "Прыжки в воду", "water"],
  ["🚣", "Гребля", "water"],
  ["🛶", "Каноэ", "water"],
  ["🏄", "Сёрфинг", "water"],
  ["🏄", "Вейкбординг", "water"],
  ["🤽", "Синхронное плавание", "water"],

  ["🏎️", "Формула-1", "motor"],
  ["🏍️", "Мотогонки", "motor"],
  ["🚗", "Ралли", "motor"],
  ["🏎️", "Картинг", "motor"],
  ["🏁", "NASCAR", "motor"],

  ["🏃", "Лёгкая атлетика", "athletics"],
  ["🤸", "Спортивная гимнастика", "athletics"],
  ["🏋️", "Тяжёлая атлетика", "athletics"],
  ["🚴", "Велоспорт", "athletics"],
  ["🧗", "Скалолазание", "athletics"],
  ["🏃", "Марафон", "athletics"],
  ["🚵", "Маунтинбайк", "athletics"],

  ["⛳", "Гольф", "other"],
  ["🏇", "Конный спорт", "other"],
  ["🎯", "Дартс", "other"],
  ["🏹", "Стрельба из лука", "other"],
  ["🎱", "Бильярд", "other"],
  ["♟️", "Шахматы", "other"],
  ["🎮", "Киберспорт", "other"],
  ["🪂", "Парашютный спорт", "other"],
  ["🥏", "Фрисби", "other"],
  ["🎳", "Боулинг", "other"],
  ["🏹", "Спортивная стрельба", "other"]

];


/* =====================================================
   CATEGORY NAMES
   ===================================================== */

const categoryNames = {

  all: "Все категории",

  team: "Командный спорт",

  racket: "Ракеточный спорт",

  combat: "Единоборства",

  winter: "Зимний спорт",

  water: "Водный спорт",

  motor: "Авто и мотоспорт",

  athletics: "Атлетика",

  other: "Другие дисциплины"

};


/* =====================================================
   VARIABLES
   ===================================================== */

let currentCategory = "all";


const searchInput =
  document.getElementById(
    "sportsSearch"
  );


const clearSearch =
  document.getElementById(
    "clearSearch"
  );


const grid =
  document.getElementById(
    "sportsGrid"
  );


const result =
  document.getElementById(
    "sportsResult"
  );


/* =====================================================
   RENDER
   ===================================================== */

function renderSports() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  clearSearch.classList.toggle(
    "show",
    search.length > 0
  );


  const filtered =
    sports.filter(
      sport => {

        const name =
          sport[1]
            .toLowerCase();


        const matchesSearch =
          name.includes(search);


        const matchesCategory =
          currentCategory === "all" ||
          sport[2] === currentCategory;


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  result.textContent =
    `Найдено видов спорта: ${filtered.length}`;


  if (!filtered.length) {

    grid.innerHTML = `

      <div class="empty-sports">

        <div class="empty-sports-icon">
          🔎
        </div>

        <h3>
          Ничего не найдено
        </h3>

        <p>
          Попробуй изменить поиск
          или выбрать другую категорию.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered
      .map(
        sport => `

          <a
            class="sport-item"
            href="sport.html?sport=${encodeURIComponent(sport[1])}"
          >

            <span class="sport-arrow">
              →
            </span>

            <div class="sport-item-icon">
              ${sport[0]}
            </div>

            <h3>
              ${sport[1]}
            </h3>

            <p>
              ${categoryNames[sport[2]]}
            </p>

          </a>

        `
      )
      .join("");

}


/* =====================================================
   SEARCH
   ===================================================== */

searchInput.addEventListener(
  "input",
  renderSports
);


clearSearch.addEventListener(
  "click",
  function() {

    searchInput.value = "";

    searchInput.focus();

    renderSports();

  }
);


/* =====================================================
   CATEGORIES
   ===================================================== */

document
  .querySelectorAll(
    ".category-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          currentCategory =
            this.dataset.category;


          document
            .querySelectorAll(
              ".category-button"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          this.classList.add(
            "active"
          );


          renderSports();

        }
      );

    }
  );


/* =====================================================
   URL SEARCH
   ===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const sportFromUrl =
  params.get("sport");


if (sportFromUrl) {

  searchInput.value =
    sportFromUrl;

}


/* =====================================================
   START
   ===================================================== */

renderSports();

</script>


</body>
</html>
