  <style>

    /* =====================================================
       SPORT PAGE
       ===================================================== */

    .sport-page {
      min-height: 100vh;
      padding: 55px 0 90px;
    }

    .sport-page-inner {
      width: min(
        1050px,
        calc(100% - 36px)
      );

      margin: auto;
    }


    /* =====================================================
       BACK
       ===================================================== */

    .back-link {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 24px;

      color: var(--muted);

      font-size: 13px;

      font-weight: 850;

      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--red);

      transform: translateX(-3px);
    }


    /* =====================================================
       SPORT HERO
       ===================================================== */

    .sport-hero-card {
      position: relative;

      overflow: hidden;

      padding: 55px;

      border-radius: 30px;

      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(239,68,68,.30),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 100%,
          rgba(239,68,68,.10),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #080b10,
          #111827 65%,
          #171d29
        );

      color: white;

      box-shadow: var(--shadow-lg);
    }


    .sport-hero-card::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: .035;

      background-image:
        linear-gradient(
          rgba(255,255,255,.5) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.5) 1px,
          transparent 1px
        );

      background-size: 38px 38px;

      pointer-events: none;
    }


    .sport-hero-card::after {
      content: "";

      position: absolute;

      width: 430px;

      height: 430px;

      right: -220px;

      bottom: -230px;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 50%;

      box-shadow:
        0 0 0 70px rgba(255,255,255,.015),
        0 0 0 140px rgba(255,255,255,.01);
    }


    /* =====================================================
       ICON
       ===================================================== */

    .sport-big-icon {
      position: relative;

      z-index: 2;

      width: 105px;

      height: 105px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 25px;

      border: 1px solid rgba(255,255,255,.13);

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.13),
          rgba(255,255,255,.035)
        );

      box-shadow:
        0 20px 45px rgba(0,0,0,.25);

      font-size: 58px;

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);
    }


    /* =====================================================
       CATEGORY
       ===================================================== */

    .sport-category {
      position: relative;

      z-index: 2;

      display: inline-flex;

      align-items: center;

      margin-bottom: 12px;

      padding: 7px 11px;

      border: 1px solid rgba(239,68,68,.2);

      border-radius: 20px;

      background: rgba(239,68,68,.13);

      color: #fca5a5;

      font-size: 10px;

      font-weight: 950;

      text-transform: uppercase;

      letter-spacing: 1.2px;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    .sport-hero-card h1 {
      position: relative;

      z-index: 2;

      margin: 0 0 16px;

      font-size: clamp(
        44px,
        7vw,
        70px
      );

      line-height: .98;

      letter-spacing: -3.5px;

      font-weight: 950;
    }


    .sport-description {
      position: relative;

      z-index: 2;

      max-width: 690px;

      margin: 0;

      color: #aeb8c7;

      font-size: 16px;

      line-height: 1.75;
    }


    /* =====================================================
       ACTIONS
       ===================================================== */

    .sport-actions {
      position: relative;

      z-index: 3;

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 30px;
    }


    .favorite-button {
      min-height: 50px;

      padding: 0 19px;

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 12px;

      background: rgba(255,255,255,.07);

      color: white;

      font-family: inherit;

      font-size: 13px;

      font-weight: 850;

      cursor: pointer;

      transition: var(--transition);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);
    }


    .favorite-button:hover {
      background: rgba(255,255,255,.12);

      border-color: rgba(239,68,68,.35);
    }


    .favorite-button.active {
      background: rgba(239,68,68,.14);

      border-color: rgba(239,68,68,.35);

      color: #fca5a5;
    }


    /* =====================================================
       INFO GRID
       ===================================================== */

    .sport-info-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;

      margin-top: 16px;
    }


    .info-card {
      min-height: 175px;

      padding: 23px;

      border: 1px solid var(--border);

      border-radius: 19px;

      background: white;

      box-shadow: var(--shadow-sm);

      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }


    .info-card:hover {
      transform: translateY(-4px);

      border-color: #fecaca;

      box-shadow:
        0 18px 35px rgba(0,0,0,.07);
    }


    .info-icon {
      width: 48px;

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 18px;

      border-radius: 14px;

      background: var(--red-light);

      font-size: 23px;
    }


    .info-card h3 {
      margin: 0 0 6px;

      font-size: 15px;

      font-weight: 900;
    }


    .info-card p {
      margin: 0;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.55;
    }


    /* =====================================================
       ABOUT
       ===================================================== */

    .sport-about {
      margin-top: 16px;

      padding: 32px;

      border: 1px solid var(--border);

      border-radius: 21px;

      background: white;

      box-shadow: var(--shadow-sm);
    }


    .sport-about-header {
      display: flex;

      align-items: center;

      gap: 13px;

      margin-bottom: 16px;
    }


    .sport-about-header-icon {
      width: 43px;

      height: 43px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background: var(--red-light);

      font-size: 20px;
    }


    .sport-about h2 {
      margin: 0;

      font-size: 25px;

      letter-spacing: -1px;

      font-weight: 950;
    }


    .sport-about p {
      margin: 0;

      color: var(--muted);

      line-height: 1.8;

      font-size: 14px;
    }


    /* =====================================================
       NOT FOUND
       ===================================================== */

    .not-found {
      padding: 70px 25px;

      text-align: center;

      background: white;

      border-radius: 22px;

      border: 1px solid var(--border);

      box-shadow: var(--shadow-sm);
    }


    .not-found-icon {
      width: 75px;

      height: 75px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0 auto 18px;

      border-radius: 22px;

      background: var(--red-light);

      font-size: 38px;
    }


    .not-found h1 {
      margin: 0 0 10px;

      font-size: 32px;

      font-weight: 950;
    }


    .not-found p {
      margin: 0 0 25px;

      color: var(--muted);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .sport-page {

        border-radius: 22px;

        font-size: 45px;
      }


      .sport-hero-card h1 {
        font-size: 44px;

        letter-spacing: -2.5px;
      }


      .sport-description {
        font-size: 14px;

        line-height: 1.7;
      }


      .sport-actions {
        flex-direction: column;
      }


      .sport-actions .button,
      .favorite-button {
        width: 100%;
      }


      .sport-info-grid {
        grid-template-columns: 1fr;

        gap: 10px;
      }


      .info-card {

        padding: 20px;
      }


      .info-icon {

      }


      .sport-about {
        padding: 25px 21px;

      }


      .sport-about h2 {

      }


      .sport-about p {
        font-size: 13px;
      }


      .not-found {
        padding: 55px 20px;
      }

    @media (max-width: 390px) {

      .sport-hero-card h1 {
        font-size: 39px;
      }

      .sport-big-icon {
        width: 75px;

        height: 75px;

        font-size: 40px;
      }

    }

  </style>

</head>

/* =====================================================
   SHOW SPORT
   ===================================================== */

function showSport(sport) {

  const infoCards =
    sport.info
      .map(
        item => `

          <div class="info-card">

            <div class="info-icon">
              ${item[0]}
            </div>

            <h3>
              ${item[1]}
            </h3>

            <p>
              ${item[2]}
            </p>

          </div>

        `
      )
      .join("");


  content.innerHTML = `

    <section class="sport-hero-card">

      <div class="sport-big-icon">
        ${sport.icon}
      </div>

      <div class="sport-category">
        ${sport.category}
      </div>

      <h1>
        ${sportName}
      </h1>

      <p class="sport-description">
        ${sport.description}
      </p>


      <div class="sport-actions">

        <button
          id="favoriteButton"
          class="favorite-button"
          type="button"
        >
          ♡ Добавить в избранное
        </button>


        <a
          href="sports.html"
          class="button button-light button-large"
        >
          Все виды спорта
        </a>

      </div>

    </section>


    <section class="sport-info-grid">

      ${infoCards}

    </section>


    <section class="sport-about">

      <div class="sport-about-header">

        <div class="sport-about-header-icon">
          ℹ️
        </div>

        <h2>
          О виде спорта
        </h2>

      </div>


      <p>
        ${sport.description}

        В SportRoom ты сможешь следить
        за любимыми спортивными направлениями,
        сохранять их в избранное и создавать
        собственный спортивный профиль.
      </p>

    </section>

  `;


  setupFavorite();

}



/* =====================================================
   FAVORITE
   ===================================================== */

function setupFavorite() {

  const button =
    document.getElementById(
      "favoriteButton"
    );


  const storageKey =
    "sportroom_favorite_" +
    sportName;


  const isFavorite =
    localStorage.getItem(
      storageKey
    ) === "true";


  updateFavoriteButton(
    button,
    isFavorite
  );


  button.addEventListener(
    "click",
    function() {

      const current =
        localStorage.getItem(
          storageKey
        ) === "true";


      const newValue =
        !current;


      localStorage.setItem(
        storageKey,
        newValue
      );


      updateFavoriteButton(
        button,
        newValue
      );

    }
  );

}



/* =====================================================
   FAVORITE BUTTON
   ===================================================== */

function updateFavoriteButton(
  button,
  isFavorite
) {

  if (isFavorite) {

    button.classList.add(
      "active"
    );

    button.innerHTML =
      "♥ В избранном";

  } else {

    button.classList.remove(
      "active"
    );

    button.innerHTML =
      "♡ Добавить в избранное";

  }

}



/* =====================================================
   NOT FOUND
   ===================================================== */

if (
  sportName &&
  sports[sportName]
) {

  showSport(
    sports[sportName]
  );

} else {

  content.innerHTML = `

    <div class="not-found">

      <div class="not-found-icon">
        🏆
      </div>

      <h1>
        Спорт не найден
      </h1>

      <p>
        Выбери вид спорта из нашего каталога.
      </p>

      <a
        href="sports.html"
        class="button button-red button-large"
      >
        Перейти к видам спорта
      </a>

    </div>

  `;

}

</script>


</body>
</html>
