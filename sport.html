<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SportRoom — Спорт</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .sport-page {
      min-height: 100vh;
      padding: 60px 0 90px;
    }

    .sport-page-inner {
      width: min(1050px, calc(100% - 36px));
      margin: auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;

      color: #6b7280;
      font-size: 14px;
      font-weight: 800;
    }

    .back-link:hover {
      color: #ef4444;
    }

    .sport-hero-card {
      position: relative;
      overflow: hidden;

      padding: 55px;

      border-radius: 28px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(239, 68, 68, .35),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #0b1120,
          #1f2937
        );

      color: white;

      box-shadow:
        0 25px 60px rgba(0,0,0,.12);
    }

    .sport-hero-card::after {
      content: "";

      position: absolute;

      width: 350px;
      height: 350px;

      right: -150px;
      bottom: -180px;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 50%;
    }

    .sport-big-icon {
      position: relative;
      z-index: 2;

      width: 105px;
      height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 25px;

      border-radius: 28px;

      background: rgba(255,255,255,.1);

      border: 1px solid rgba(255,255,255,.12);

      font-size: 60px;
    }

    .sport-category {
      position: relative;
      z-index: 2;

      display: inline-block;

      margin-bottom: 12px;

      padding: 7px 11px;

      border-radius: 20px;

      background: rgba(239,68,68,.18);

      color: #fca5a5;

      font-size: 11px;
      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .sport-hero-card h1 {
      position: relative;
      z-index: 2;

      margin: 0 0 15px;

      font-size: clamp(42px, 7vw, 68px);

      letter-spacing: -3px;
    }

    .sport-description {
      position: relative;
      z-index: 2;

      max-width: 650px;

      margin: 0;

      color: #cbd5e1;

      font-size: 17px;

      line-height: 1.7;
    }

    .sport-info-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin-top: 25px;
    }

    .info-card {
      padding: 25px;

      border: 1px solid #e5e7eb;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 5px 20px rgba(0,0,0,.04);
    }

    .info-icon {
      font-size: 28px;

      margin-bottom: 12px;
    }

    .info-card h3 {
      margin: 0 0 7px;

      font-size: 16px;
    }

    .info-card p {
      margin: 0;

      color: #6b7280;

      font-size: 13px;

      line-height: 1.5;
    }

    .sport-about {
      margin-top: 25px;

      padding: 35px;

      border-radius: 20px;

      background: white;

      border: 1px solid #e5e7eb;
    }

    .sport-about h2 {
      margin: 0 0 15px;

      font-size: 28px;

      letter-spacing: -1px;
    }

    .sport-about p {
      margin: 0;

      color: #6b7280;

      line-height: 1.8;

      font-size: 15px;
    }

    .sport-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 30px;
    }

    .favorite-button {
      border: 1px solid #e5e7eb;

      background: white;

      color: #374151;

      min-height: 50px;

      padding: 0 20px;

      border-radius: 12px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }

    .favorite-button:hover {
      border-color: #fecaca;

      color: #ef4444;
    }

    .favorite-button.active {
      background: #fff1f2;

      border-color: #fecaca;

      color: #dc2626;
    }

    .not-found {
      padding: 70px 25px;

      text-align: center;

      background: white;

      border-radius: 22px;

      border: 1px solid #e5e7eb;
    }

    .not-found-icon {
      font-size: 55px;

      margin-bottom: 15px;
    }

    .not-found h1 {
      margin: 0 0 10px;

      font-size: 32px;
    }

    .not-found p {
      margin: 0 0 25px;

      color: #6b7280;
    }

    @media (max-width: 700px) {

      .sport-page {
        padding: 35px 0 60px;
      }

      .sport-hero-card {
        padding: 32px 25px;
      }

      .sport-hero-card h1 {
        font-size: 45px;
      }

      .sport-info-grid {
        grid-template-columns: 1fr;
      }

      .sport-about {
        padding: 25px;
      }

      .sport-actions {
        flex-direction: column;
      }

      .sport-actions .button,
      .favorite-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

const params =
  new URLSearchParams(
    window.location.search
  );


const sportName =
  params.get("sport");


const content =
  document.getElementById(
    "sportContent"
  );


function showSport(sport) {

  const infoCards =
    sport.info.map(item => `

      <div class="info-card">

        <div class="info-icon">
          ${item[0]}
        </div>

        <h3>
          ${item[1]}
        </h3>

        <p>
          ${item[2]}
        </p>

      </div>

    `).join("");


  content.innerHTML = `

    <section class="sport-hero-card">

      <div class="sport-big-icon">
        ${sport.icon}
      </div>

      <div class="sport-category">
        ${sport.category}
      </div>

      <h1>
        ${sportName}
      </h1>

      <p class="sport-description">
        ${sport.description}
      </p>

      <div class="sport-actions">

        <button
          id="favoriteButton"
          class="favorite-button"
          type="button"
        >
          ♡ Добавить в избранное
        </button>

        <a
          href="sports.html"
          class="button button-light button-large"
        >
          Все виды спорта
        </a>

      </div>

    </section>


    <section class="sport-info-grid">

      ${infoCards}

    </section>


    <section class="sport-about">

      <h2>
        О виде спорта
      </h2>

      <p>
        ${sport.description}
        В SportRoom ты сможешь следить за любимыми
        спортивными направлениями, сохранять их
        в избранное и создавать собственный
        спортивный профиль.
      </p>

    </section>

  `;


  setupFavorite();

}


function setupFavorite() {

  const button =
    document.getElementById(
      "favoriteButton"
    );


  const storageKey =
    "sportroom_favorite_" +
    sportName;


  const isFavorite =
    localStorage.getItem(
      storageKey
    ) === "true";


  updateFavoriteButton(
    button,
    isFavorite
  );


  button.addEventListener(
    "click",
    function() {

      const current =
        localStorage.getItem(
          storageKey
        ) === "true";


      const newValue =
        !current;


      localStorage.setItem(
        storageKey,
        newValue
      );


      updateFavoriteButton(
        button,
        newValue
      );

    }
  );

}


function updateFavoriteButton(
  button,
  isFavorite
) {

  if (isFavorite) {

    button.classList.add(
      "active"
    );

    button.innerHTML =
      "♥ В избранном";

  } else {

    button.classList.remove(
      "active"
    );

    button.innerHTML =
      "♡ Добавить в избранное";

  }

}


if (
  sportName &&
  sports[sportName]
) {

  showSport(
    sports[sportName]
  );

} else {

  content.innerHTML = `

    <div class="not-found">

        class="button button-red button-large"
      >
        Перейти к видам спорта
      </a>

    </div>

  `;

}
