<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0f14"
  >

  <title>Вход — SportRoom</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-light: #fff1f2;

      --dark: #0b0f14;
      --text: #17191c;
      --muted: #73777d;

      --border: #e5e7eb;

      --bg: #f4f6f8;

      --shadow:
        0 20px 60px rgba(0, 0, 0, .10);
    }


    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(239, 68, 68, .08),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(239, 68, 68, .06),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {
      height: 70px;

      background: rgba(255,255,255,.92);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }


    .header-inner {
      width: min(
        1100px,
        calc(100% - 36px)
      );

      height: 100%;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .logo {
      text-decoration: none;

      color: #111;

      font-size: 25px;

      font-weight: 900;

      letter-spacing: -.8px;
    }


    .logo span {
      color: var(--red);
    }


    .back-home {
      text-decoration: none;

      color: var(--muted);

      font-size: 14px;

      font-weight: 700;

      transition: .2s ease;
    }


    .back-home:hover {
      color: var(--red);

      transform: translateX(-2px);
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .login-page {
      min-height:
        calc(100vh - 70px);

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        45px 18px 70px;
    }


    .login-container {
      width: 100%;

      max-width: 450px;
    }


    /* =====================================================
       CARD
       ===================================================== */

    .login-card {
      background: white;

      border: 1px solid rgba(0,0,0,.04);

      border-radius: 25px;

      padding: 38px;

      box-shadow: var(--shadow);
    }


    .login-icon {
      width: 70px;

      height: 70px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0 auto 20px;

      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          #ef4444,
          #dc2626
        );

      color: white;

      font-size: 32px;

      box-shadow:
        0 12px 30px rgba(239,68,68,.25);
    }


    .login-card h1 {
      text-align: center;

      font-size: 31px;

      font-weight: 950;

      letter-spacing: -1.4px;

      margin-bottom: 8px;
    }


    .login-subtitle {
      text-align: center;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 28px;
    }


    /* =====================================================
       LOGIN TYPE
       ===================================================== */

    .login-type {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      padding: 5px;

      margin-bottom: 22px;

      background: #f3f4f6;

      border-radius: 13px;
    }


    .login-type button {
      min-height: 42px;

      border: 0;

      border-radius: 9px;

      background: transparent;

      color: #73777d;

      font-family: inherit;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;
    }


    .login-type button.active {
      background: white;

      color: var(--text);

      box-shadow:
        0 3px 10px rgba(0,0,0,.07);
    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-group {
      margin-bottom: 18px;
    }


    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 800;
    }


    .input-wrapper {
      position: relative;
    }


    .form-input {
      width: 100%;

      min-height: 52px;

      padding:
        0 15px;

      border:
        1px solid #d9dde2;

      border-radius: 12px;

      outline: none;

      background: white;

      color: var(--text);

      font-family: inherit;

      font-size: 15px;

      transition: .2s ease;
    }


    .form-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 4px
        rgba(239,68,68,.09);
    }


    .password-input {
      padding-right: 55px;
    }


    .password-toggle {
      position: absolute;

      top: 50%;

      right: 8px;

      transform: translateY(-50%);

      width: 40px;

      height: 40px;

      border: 0;

      border-radius: 9px;

      background: transparent;

      cursor: pointer;

      font-size: 18px;

      opacity: .65;
    }


    .password-toggle:hover {
      background: #f3f4f6;

      opacity: 1;
    }


    /* =====================================================
       PHONE
       ===================================================== */

    .phone-wrapper {
      display: flex;

      gap: 8px;
    }


    .country-code {
      width: 115px;

      min-height: 52px;

      padding: 0 10px;

      border:
        1px solid #d9dde2;

      border-radius: 12px;

      background: white;

      outline: none;

      font-family: inherit;

      font-size: 14px;

      cursor: pointer;
    }


    .phone-number {
      flex: 1;
    }


    /* =====================================================
       OPTIONS
       ===================================================== */

    .form-options {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin:
        2px 0 22px;
    }


    .remember {
      display: flex;

      align-items: center;

      gap: 8px;

      color: #666;

      font-size: 12px;

      cursor: pointer;
    }


    .remember input {
      width: 16px;

      height: 16px;

      accent-color: var(--red);

      cursor: pointer;
    }


    .forgot {
      border: 0;

      background: transparent;

      color: var(--red);

      font-family: inherit;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;
    }


    /* =====================================================
       BUTTON
       ===================================================== */

    .login-button {
      width: 100%;

      min-height: 53px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-dark)
        );

      color: white;

      font-family: inherit;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 10px 25px
        rgba(239,68,68,.20);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .login-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(239,68,68,.28);
    }


    .login-button:active {
      transform: translateY(0);
    }


    .login-button.loading {
      pointer-events: none;

      opacity: .7;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      display: none;

      margin-top: 15px;

      padding: 13px 14px;

      border-radius: 11px;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }


    .message.error {
      display: block;

      background: #fff1f2;

      border: 1px solid #fecdd3;

      color: #be123c;
    }


    .message.success {
      display: block;

      background: #ecfdf5;

      border: 1px solid #bbf7d0;

      color: #15803d;
    }


    /* =====================================================
       DIVIDER
       ===================================================== */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        25px 0 20px;

      color: #a0a4aa;

      font-size: 11px;

      font-weight: 700;
    }


    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: #e8eaed;
    }


    /* =====================================================
       REGISTER
       ===================================================== */

    .register-link {
      display: block;

      text-align: center;

      color: #666;

      font-size: 13px;

      line-height: 1.6;
    }


    .register-link a {
      color: var(--red);

      text-decoration: none;

      font-weight: 900;
    }


    .register-link a:hover {
      text-decoration: underline;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      padding:
        20px;

      text-align: center;

      color: #999;

      font-size: 12px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      header {
        height: 60px;
      }


      .header-inner {
        width:

      }


      .logo {
        font-size: 22px;
      }


      .back-home {
        font-size: 12px;
      }

        width: 62px;

        border-radius: 18px;

        font-size: 28px;
      }


      .login-card h1 {
        font-size: 27px;
      }


      .login-subtitle {
        font-size: 13px;

        margin-bottom: 23px;
      }


      .country-code {
        width: 105px;
      }

    }


    @media (max-width: 360px) {

      .phone-wrapper {
        flex-direction: column;
      }


      .country-code {
        width: 100%;
      }

    }

  </style>

</head>

<script>

/* =====================================================
   LOGIN TYPE
   ===================================================== */

let loginType = "email";


function switchLoginType(type) {

  loginType = type;

  const emailTab =
    document.getElementById("emailTab");

  const phoneTab =
    document.getElementById("phoneTab");

  const emailField =
    document.getElementById("emailField");

  const phoneField =
    document.getElementById("phoneField");


  if (type === "email") {

    emailTab.classList.add("active");

    phoneTab.classList.remove("active");

    emailField.style.display = "block";

    phoneField.style.display = "none";

    document
      .getElementById("email")
      .focus();

  } else {

    emailTab.classList.remove("active");

    phoneTab.classList.add("active");

    emailField.style.display = "none";

    phoneField.style.display = "block";

    document
      .getElementById("phone")
      .focus();

  }


  clearMessage();

}



/* =====================================================
   PASSWORD
   ===================================================== */

function togglePassword() {

  const password =
    document.getElementById("password");

  const toggle =
    document.getElementById("passwordToggle");


  if (password.type === "password") {

    password.type = "text";

    toggle.textContent = "🙈";

  } else {

    password.type = "password";

    toggle.textContent = "👁️";

  }

}



/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
  text,
  type = "error"
) {

  const message =
    document.getElementById("message");


  message.textContent = text;

  message.className =
    "message " + type;

}


function clearMessage() {

  const message =
    document.getElementById("message");

  message.textContent = "";

  message.className = "message";

}



/* =====================================================
   NORMALIZE PHONE
   ===================================================== */

function normalizePhone(
  countryCode,
  phone
) {

  let number =
    String(phone || "")
      .replace(/\D/g, "");


  /*
    Если пользователь написал
    номер с 0 в начале —
    убираем этот 0.
  */

  while (
    number.startsWith("0")
  ) {

    number =
      number.substring(1);

  }


  return countryCode + number;

}



/* =====================================================
   FIND USER
   ===================================================== */

function getRegisteredUsers() {

  try {

    const users =
      JSON.parse(
        localStorage.getItem(
          "sportroom_users"
        ) || "[]"
      );


    if (Array.isArray(users)) {

      return users;

    }

  } catch (error) {

    console.error(
      "Ошибка чтения пользователей:",
      error
    );

  }


  return [];

}



/* =====================================================
   SAVE CURRENT USER
   ===================================================== */

function saveCurrentUser(user) {

  /*
    Создаём профиль SportRoom
  */

  const profile = {

    name:
      user.name ||
      "Пользователь",

    surname:
      user.surname ||
      "",

    email:
      user.email ||
      "",

    phone:
      user.phone ||
      "",

    city:
      user.city ||
      "",

    sport:
      user.sport ||
      "Футбол",

    about:
      user.about ||
      "Расскажите немного о себе.",

    points:
      user.points || 0,

    level:
      user.level || 1,

    avatar:
      user.avatar ||
      ""

  };


  localStorage.setItem(
    "sportroom_profile",
    JSON.stringify(profile)
  );


  localStorage.setItem(
    "sportroom_logged_in",
    "true"
  );


  /*
    Отдельные значения
    для совместимости
    с другими страницами.
  */

  localStorage.setItem(
    "name",
    profile.name
  );

  localStorage.setItem(
    "surname",
    profile.surname
  );

  localStorage.setItem(
    "email",
    profile.email
  );

  localStorage.setItem(
    "city",
    profile.city
  );

  if (profile.phone) {

    localStorage.setItem(
      "phone",
      profile.phone
    );

  }

}



/* =====================================================
   LOGIN
   ===================================================== */

function login() {

  clearMessage();


  const password =
    document
      .getElementById("password")
      .value;


  if (!password) {

    showMessage(
      "Введите пароль."
    );

    return;

  }


  let identifier = "";


  /*
    EMAIL
  */

  if (loginType === "email") {

    identifier =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    if (!identifier) {

      showMessage(
        "Введите email."
      );

      document
        .getElementById("email")
        .focus();

      return;

    }


    if (
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(identifier)
    ) {

      showMessage(
        "Введите корректный email."
      );

      return;

    }

  }


  /*
    PHONE
  */

  else {

    const countryCode =
      document
        .getElementById("countryCode")
        .value;


    const phone =
      document
        .getElementById("phone")
        .value;


    const digits =
      phone.replace(/\D/g, "");


    if (!digits) {

      showMessage(
        "Введите номер телефона."
      );

      document
        .getElementById("phone")
        .focus();

      return;

    }


    if (digits.length < 5) {

      showMessage(
        "Введите корректный номер телефона."
      );

      return;

    }


    identifier =
      normalizePhone(
        countryCode,
        phone
      );

  }



  const users =
    getRegisteredUsers();


  /*
    Ищем пользователя
  */

  let user = null;


  if (loginType === "email") {

    user =
      users.find(
        item =>
          String(item.email || "")
            .toLowerCase() === identifier
      );

  } else {

    user =
      users.find(
        item =>
          normalizeStoredPhone(
            item.phone
          ) === identifier
      );

  }



  /*
    Если пользователей
    в массиве нет,
    проверяем старые данные.
  */

  if (!user) {

    user =
      checkLegacyAccount(
        identifier,
        password
      );

  }



  /*
    Пользователь не найден
  */

  if (!user) {

    showMessage(
      "Аккаунт не найден. Проверьте данные или зарегистрируйтесь."
    );

    return;

  }



  /*
    Проверяем пароль
  */

  if (
    String(user.password || "") !==
    String(password)
  ) {

    showMessage(
      "Неверный пароль."
    );

    return;

  }



  /*
    Запоминаем пользователя
  */

  saveCurrentUser(user);


  /*
    Запоминаем email/телефон,
    если включена галочка.
  */

  const remember =
    document
      .getElementById("remember")
      .checked;


  if (remember) {

    localStorage.setItem(
      "sportroom_last_login",
      identifier
    );

    localStorage.setItem(
      "sportroom_login_type",
      loginType
    );

  } else {

    localStorage.removeItem(
      "sportroom_last_login"
    );

    localStorage.removeItem(
      "sportroom_login_type"
    );

  }



  /*
    Успешный вход
  */

  const button =
    document.getElementById(
      "loginButton"
    );


  button.classList.add(
    "loading"
  );


  button.textContent =
    "Выполняется вход...";


  showMessage(
    "Вход выполнен! Перенаправляем в профиль...",
    "success"
  );


  setTimeout(
    function() {

      window.location.href =
        "profile.html";

    },
    700
  );

}



/* =====================================================
   NORMALIZE STORED PHONE
   ===================================================== */

function normalizeStoredPhone(
  phone
) {

  if (!phone) {

    return "";

  }


  let value =
    String(phone)
      .trim()
      .replace(/[^\d+]/g, "");


  /*
    Если номер хранится
    без + — добавляем
    его только если он
    начинается с кода.
  */

  if (
    value &&
    !value.startsWith("+")
  ) {

    value = "+" + value;

  }


  return value;

}



/* =====================================================
   LEGACY ACCOUNT
   ===================================================== */

function checkLegacyAccount(
  identifier,
  password
) {

  /*
    Поддержка старой версии
    проекта, где данные
    могли храниться отдельно.
  */

  const oldEmail =
    (
      localStorage.getItem("email") ||
      ""
    )
      .trim()
      .toLowerCase();


  const oldPhone =
    normalizeStoredPhone(
      localStorage.getItem("phone")
    );


  /*
    Если email совпал
  */

  if (
    loginType === "email" &&
    oldEmail === identifier
  ) {

    const savedPassword =
      localStorage.getItem(
        "password"
      );


    if (
      savedPassword &&
      savedPassword === password
    ) {

      return {

        name:
          localStorage.getItem(
            "name"
          ) || "Пользователь",

        surname:
          localStorage.getItem(
            "surname"
          ) || "",

        email:
          oldEmail,

        phone:
          oldPhone,

        city:
          localStorage.getItem(
            "city"
          ) || "",

        password:
          savedPassword,

        sport:
          "Футбол",

        points: 0,

        level: 1

      };

    }

  }



  /*
    Если телефон совпал
  */

  if (
    loginType === "phone" &&
    oldPhone === identifier
  ) {

    const savedPassword =
      localStorage.getItem(
        "password"
      );


    if (
      savedPassword &&
      savedPassword === password
    ) {

      return {

        name:
          localStorage.getItem(
            "name"
          ) || "Пользователь",

        surname:
          localStorage.getItem(
            "surname"
          ) || "",

        email:
          oldEmail,

        phone:
          oldPhone,

        city:
          localStorage.getItem(
            "city"
          ) || "",

        password:
          savedPassword,

        sport:
          "Футбол",

        points: 0,

        level: 1

      };

    }

  }


  return null;

}



/* =====================================================
   FORGOT PASSWORD
   ===================================================== */

function forgotPassword() {

  if (loginType === "email") {

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    if (!email) {

      showMessage(
        "Сначала введи свой email."
      );

      document
        .getElementById("email")
        .focus();

      return;

    }


    showMessage(
      "Для восстановления пароля в реальной версии понадобится отправка письма на " +
      email +
      ".",
      "success"
    );

  } else {

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    if (!phone) {

      showMessage(
        "Сначала введи номер телефона."
      );

      document
        .getElementById("phone")
        .focus();

      return;

    }


    showMessage(
      "Для восстановления пароля по SMS понадобится подключить SMS-сервис.",
      "success"
    );

  }

}

    if (
