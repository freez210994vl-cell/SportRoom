<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SportRoom — Вход</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .auth-page {
      min-height: calc(100vh - 72px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 18px;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(239,68,68,.08),
          transparent 30%
        ),
        #f5f7fa;
    }

    .auth-card {
      width: min(440px, 100%);

      padding: 38px;

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 22px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.08);
    }

    .auth-logo {
      text-align: center;

      margin-bottom: 25px;
    }

    .auth-logo .logo {
      color: #111827;
    }

    .auth-header {
      text-align: center;

      margin-bottom: 28px;
    }

    .auth-header h1 {
      margin: 0 0 9px;

      font-size: 32px;

      letter-spacing: -1px;
    }

    .auth-header p {
      margin: 0;

      color: #6b7280;

      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 13px;

      font-weight: 800;
    }

    .form-input {
      width: 100%;

      min-height: 49px;

      padding: 0 14px;

      border: 1px solid #d1d5db;

      border-radius: 11px;

      background: white;

      color: #111827;

      font-size: 15px;

      outline: none;

      transition: .2s;
    }

    .form-input:focus {
      border-color: #ef4444;

      box-shadow:
        0 0 0 3px rgba(239,68,68,.1);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .form-input {
      padding-right: 48px;
    }

    .show-password {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #6b7280;

      font-size: 18px;
    }

    .auth-submit {
      width: 100%;

      min-height: 50px;

      margin-top: 8px;

      border: 0;

      border-radius: 11px;

      background: #ef4444;

      color: white;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    .auth-submit:hover {
      background: #dc2626;

      transform: translateY(-1px);
    }

    .auth-submit:disabled {
      opacity: .65;

      cursor: wait;

      transform: none;
    }

    .auth-message {
      display: none;

      margin-bottom: 18px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }

    .auth-message.error {
      display: block;

      background: #fef2f2;

      border: 1px solid #fecaca;

      color: #b91c1c;
    }

    .auth-message.success {
      display: block;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;

      color: #15803d;
    }

    .auth-footer {
      margin-top: 24px;

      padding-top: 22px;

      border-top: 1px solid #e5e7eb;

      text-align: center;

      color: #6b7280;

      font-size: 14px;
    }

    .auth-footer a {
      color: #ef4444;

      font-weight: 800;
    }

    .forgot-password {
      display: block;

      margin-top: 9px;

      text-align: right;

      color: #ef4444;

      font-size: 12px;

      font-weight: 700;
    }

    @media (max-width: 600px) {
      .auth-page {
        padding: 30px 12px;
      }

      .auth-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>


<!-- HEADER -->

<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">
      Sport<span>Room</span>
    </a>

    <nav class="nav">

      <a href="index.html">
        Главная
      </a>

      <a href="sports.html">
        Спорт
      </a>

      <a href="profile.html">
        Профиль
      </a>

    </nav>

    <div class="header-buttons">

      <a
        href="login.html"
        class="button button-dark"
      >
        Войти
      </a>

      <a
        href="register.html"
        class="button button-red"
      >
        Регистрация
      </a>

    </div>

  </div>

</header>


<!-- LOGIN -->

<main class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">

      <a
        href="index.html"
        class="logo"
      >
        Sport<span>Room</span>
      </a>

    </div>


    <div class="auth-header">

      <h1>
        С возвращением 👋
      </h1>

      <p>
        Войди в свой аккаунт SportRoom
      </p>

    </div>


    <div
      id="authMessage"
      class="auth-message"
    ></div>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          class="form-input"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Пароль
        </label>

        <div class="password-wrap">

          <input
            id="password"
            class="form-input"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required
          >

          <button
            id="showPassword"
            class="show-password"
            type="button"
            aria-label="Показать пароль"
          >
            👁
          </button>

        </div>


        <a
          href="#"
          id="forgotPassword"
          class="forgot-password"
        >
          Забыли пароль?
        </a>

      </div>


      <button
        id="loginButton"
        class="auth-submit"
        type="submit"
      >
        Войти
      </button>

    </form>


    <div class="auth-footer">

      Нет аккаунта?

      <a href="register.html">
        Создать аккаунт
      </a>

    </div>

  </div>

</main>


<script>

/*
  ВАЖНО:

  Настоящую авторизацию через Supabase
  подключим следующим шагом.

  Пока эта страница готовит интерфейс
  входа и проверку формы.
*/


const loginForm =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const message =
  document.getElementById(
    "authMessage"
  );


const showPassword =
  document.getElementById(
    "showPassword"
  );


function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "auth-message " + type;

}


showPassword.addEventListener(
  "click",
  function() {

    if (
      passwordInput.type ===
      "password"
    ) {

      passwordInput.type =
        "text";

      this.textContent =
        "🙈";

    } else {

      passwordInput.type =
        "password";

      this.textContent =
        "👁";

    }

  }
);


loginForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    const email =
      emailInput.value.trim();


    const password =
      passwordInput.value;


    if (!email) {

      showMessage(
        "Введите email.",
        "error"
      );

      emailInput.focus();

      return;

    }


    if (!password) {

      showMessage(
        "Введите пароль.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Вход...";


    /*
      Здесь позже будет:

      supabase.auth.signInWithPassword({
        email,
        password
      })
    */


    setTimeout(
      function() {

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Войти";

        showMessage(
          "Интерфейс готов. Настоящий вход через Supabase подключим следующим шагом.",
          "success"
        );

      },
      700
    );

  }
);


document
  .getElementById(
    "forgotPassword"
  )
  .addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      showMessage(
        "Восстановление пароля подключим вместе с Supabase.",
        "success"
      );

    }
  );

</script>

</body>
</html>
